name: CMake Windows preset pipeline
variables:
  PRESET: win-release-user
  TASK: all
  TEST: '1'
  INSTALL: '0'
  FRESH: '0'
  SALTS_ROOT: '{{ env.SALTS_ROOT }}'
  SALTS_UTILS_ROOT: '{{ env.SALTS_UTILS_ROOT }}'
  QIGAO_SDK_RID: '{{ env.QIGAO_SDK_RID }}'
  QIGAO_TARGET_TRIPLET: '{{ env.QIGAO_TARGET_TRIPLET }}'
  QIGAO_HOST_TRIPLET: '{{ env.QIGAO_HOST_TRIPLET }}'
env:
  QIGAO_SDK_RID: '{{ QIGAO_SDK_RID }}'
  QIGAO_TARGET_TRIPLET: '{{ QIGAO_TARGET_TRIPLET }}'
  QIGAO_HOST_TRIPLET: '{{ QIGAO_HOST_TRIPLET }}'
  SALTS_ROOT: '{{ SALTS_ROOT }}'
  SALTS_UTILS_ROOT: '{{ SALTS_UTILS_ROOT }}'
  VSDEVCMD_BAT: '{{ env.VSDEVCMD_BAT }}'

tasks:

  - name: configure
    when: "$TASK != 'refresh' && $FRESH == '0'"
    program: cmd.exe
    args: ['/d', '/s', '/c', 'cmake\ci\run-vsdevcmd.cmd', 'cmake', '--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: configure-fresh
    when: "$TASK == 'refresh' || $FRESH == '1'"
    program: cmd.exe
    args: ['/d', '/s', '/c', 'cmake\ci\run-vsdevcmd.cmd', 'cmake', '--fresh', '--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: build
    depends_on: [configure, configure-fresh]
    when: "$TASK == 'all' || $TASK == 'build' || $TASK == 'test' || $TASK == 'install'"
    program: cmd.exe
    args: ['/d', '/s', '/c', 'cmake\ci\run-vsdevcmd.cmd', 'cmake', '--build', '--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: test
    depends_on: [build]
    when: "$TASK == 'test' || (($TASK == 'all' || $TASK == 'install') && $TEST == '1')"
    program: cmd.exe
    args: ['/d', '/s', '/c', 'cmake\ci\run-vsdevcmd.cmd', 'ctest', '--preset', '{{ PRESET }}', '--output-on-failure']
    working_dir: ../..
    timeout: 30m

  - name: install
    depends_on: [test]
    when: "$TASK == 'install' || ($TASK == 'all' && $INSTALL == '1')"
    program: cmd.exe
    args: ['/d', '/s', '/c', 'cmake\ci\run-vsdevcmd.cmd', 'cmake', '--build', '--preset', 'install-{{ PRESET }}']
    working_dir: ../..
    timeout: 30m
