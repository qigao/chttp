"openapi": "3.1.0"
"info":
  "title": "Pets API"
  "version": "1.0.0"
"paths":
  "/pets":
    "get":
      "summary": "List pets"
      "description": "Returns the available **pets**."
      "parameters":
      - "name": "limit"
        "in": "query"
        "required": !!bool false
        "schema":
          "type": "integer"
          "minimum": 1
          "maximum": 100
        "description": "Maximum number of pets to return"
      "responses":
        "200":
          "description": "Pet list"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "type": "string"
      "operationId": "list_pets"
    "post":
      "summary": "Create a pet"
      "operationId": "createPet"
      "requestBody":
        "required": !!bool true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "name":
                  "type": "string"
                  "description": "Pet name"
                  "minLength": 1
                  "maxLength": 80
              "required":
              - "name"
              "additionalProperties": !!bool false
        "description": "Pet to create"
      "responses":
        "201":
          "description": "Pet created"
