<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenAPI Explorer</title>
  <link rel="stylesheet" href="/docs/style.css">
  <script defer src="/docs/app.js"></script>
  <script defer src="/docs/alpine.js"></script>
</head>
<body x-data="apiExplorer">
  <header><a class="brand" href="/docs"><span class="logo">{ }</span> API Explorer</a><a href="/openapi.json" download>下载 OpenAPI ↗</a></header>
  <noscript>请启用 JavaScript 以浏览接口；也可以下载 OpenAPI 文档。</noscript>
  <p class="notice" x-show="loading">正在加载接口文档…</p>
  <div class="layout" x-cloak>
    <aside aria-label="接口导航">
      <p class="eyebrow">API REFERENCE</p>
      <h1 x-text="document?.info?.title || 'OpenAPI'"></h1>
      <p class="muted">版本 <span x-text="document?.info?.version || '—'"></span> · OpenAPI <span x-text="document?.openapi || '3.1'"></span></p>
      <label class="search">搜索接口<input type="search" x-model="search" placeholder="路径、方法或标签"></label>
      <p class="muted"><span x-text="filtered.length"></span> 个接口</p>
      <nav><template x-for="op in filtered" :key="op.key"><button class="nav-item" :class="{selected: active?.key === op.key}" :aria-current="active?.key === op.key ? 'page' : null" :disabled="busy" @click="select(op)"><span class="method" :data-method="op.method" x-text="op.method.toUpperCase()"></span><span x-text="op.path"></span></button></template></nav>
      <p x-show="!loading && !filtered.length" class="muted">没有匹配的接口。</p>
    </aside>
    <main>
      <div role="alert" class="error" x-show="error" x-text="error"></div>
      <template x-if="active"><div>
        <p class="eyebrow" x-text="(active.tags || ['ENDPOINT']).join(' / ')"></p>
        <div class="endpoint"><span class="method" :data-method="active.method" x-text="active.method.toUpperCase()"></span><h2 x-text="active.path"></h2></div>
        <h3 x-text="active.summary || active.operationId"></h3>
        <p class="description" x-text="active.description || '此接口暂无详细描述。'"></p>
        <p class="deprecated" x-show="active.deprecated">此接口已弃用</p>
        <form @submit.prevent="execute()">
          <section><h3>参数 <span class="count" x-text="active.parameters.length"></span></h3>
            <p class="muted" x-show="!active.parameters.length">无需请求参数。</p>
            <template x-for="(p, index) in active.parameters" :key="index"><div class="parameter">
              <label><strong x-text="p.name || p.$ref"></strong> <span class="muted" x-text="p.in"></span> <span class="required" x-show="p.required">必填</span>
                <input :aria-label="`${p.in} ${p.name}`" x-model="values[index]" :disabled="busy" placeholder="输入参数值" maxlength="8192">
              </label><p class="muted" x-text="p.description"></p>
              <details><summary>Schema 与约束</summary><pre x-text="pretty(p.schema || p)"></pre></details>
            </div></template>
          </section>
          <section x-show="active.requestBody"><h3>请求体</h3><p x-text="active.requestBody?.description"></p>
            <label>媒体类型<select x-model="media" :disabled="busy"><template x-for="type in Object.keys(active.requestBody?.content || {})" :key="type"><option :value="type" x-text="type"></option></template></select></label>
            <details><summary>Schema 与约束</summary><pre x-text="pretty(active.requestBody?.content?.[media]?.schema || active.requestBody)"></pre></details>
            <label>请求内容<textarea x-model="body" :disabled="busy" rows="7" maxlength="65536" placeholder="输入请求体，例如 JSON 对象"></textarea></label>
          </section>
          <section class="try"><h3>Try it <span class="muted">发送真实请求</span></h3>
            <label>服务地址<input type="url" x-model="base" required :disabled="busy"></label>
            <p class="muted">仅在点击后发送。跨域服务需允许 CORS；请求不携带浏览器凭据。</p>
            <button class="primary" type="submit" :disabled="busy" x-text="busy ? '请求中…' : '发送请求 →'"></button>
          </section>
        </form>
        <section x-show="result" aria-live="polite"><h3>实际响应 <span class="count" x-text="result?.status"></span> <span class="muted" x-text="result ? `${result.time} ms` : ''"></span></h3><p class="request-url" x-text="result?.url"></p><details><summary>响应头</summary><pre x-text="result?.headers"></pre></details><pre class="response" x-text="result?.text || '（空响应体）'"></pre></section>
        <section><h3>响应定义</h3><template x-for="(response, code) in active.responses || {}" :key="code"><details class="response-definition"><summary><strong x-text="code"></strong> <span x-text="response.description || response.$ref"></span></summary><pre x-text="pretty(response)"></pre></details></template></section>
      </div></template>
    </main>
  </div>
</body>
</html>
