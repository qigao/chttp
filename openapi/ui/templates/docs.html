{% extends "layout.html" %}
{% block body %}
<header>
  <a class="brand" href="/docs"><span class="logo">{ }</span> API Explorer</a>
  <a href="/openapi.json" download>下载 OpenAPI ↗</a>
</header>
<div class="layout">
  <aside aria-label="接口导航">
    <p class="eyebrow">API REFERENCE</p>
    <h1>{{ title }}</h1>
    <p class="muted">版本 {{ version }} · OpenAPI {{ openapi_version }}</p>
    {% include "operation_list.html" %}
  </aside>
  <main id="operation-detail">
    {% include "operation_detail.html" %}
  </main>
</div>
{% endblock %}
