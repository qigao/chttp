<nav id="operation-list" aria-label="接口列表">
{% for op in operations %}
  <button class="nav-item" type="button"
          data-operation-key="{{ op.route_key }}"
          aria-controls="operation-detail"
          hx-get="/docs/operations/{{ op.route_key }}"
          hx-target="#operation-detail"
          hx-swap="innerHTML"
          hx-sync="#operation-detail:replace">
    <span class="method" data-method="{{ op.method }}">{{ op.method|upper }}</span>
    <span>{{ op.path }}</span>
    <span class="muted">{{ op.summary }}</span>
  </button>
{% endfor %}
</nav>
