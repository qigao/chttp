name: Set up Salts SDKs
description: Restore the current Salts and SaltsUtils native SDKs from GitHub Packages and prepare the CHttp toolchain.
inputs:
  restore-sdks:
    description: Restore the released SDK graph; candidate qualification supplies its own graph.
    required: false
    default: "true"
  with-turbowasm:
    description: Restore the latest released TurboWasm Component SDK for WASM qualification.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up .NET for GitHub Packages
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Configure shared vcpkg binary cache
      uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
      with:
        mode: read


    - name: Verify canonical vcpkg binary cache
      shell: bash
      run: |
        set -euo pipefail
        test -n "${VCPKG_ROOT:-}"
        test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
        test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
        case "${VCPKG_BINARY_SOURCES:-}" in
          *nugetconfig*) ;;
          *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
        esac
        test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

    - name: Restore Salts SDK graph
      if: inputs.restore-sdks == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        bash cmake/ci/restore-native-sdks.sh linux-x64 "${{ inputs.with-turbowasm }}"

    - name: Prepare CHttp toolchain
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config nasm
        test -x "$VCPKG_ROOT/vcpkg"
