name: Set up versioned Salts SDKs
description: Restore exact Salts and SaltsUtils native SDKs from GitHub Packages and prepare the CHttp toolchain.
runs:
  using: composite
  steps:
    - name: Set up .NET for GitHub Packages
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
        path: vcpkg
        fetch-depth: 0
        persist-credentials: false

    - name: Restore versioned Salts SDK graph
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SALTS_VERSION: '1.2.0'
        SALTS_UTILS_VERSION: '2.0.2'
      run: |
        set -euo pipefail
        packages="$RUNNER_TEMP/qigao-native-sdk"
        config="$RUNNER_TEMP/qigao-native-sdk.config"
        project="$RUNNER_TEMP/qigao-native-sdk.csproj"

        cat > "$config" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources><clear /></packageSources>
        </configuration>
        EOF

        dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
          --name github --username qigao --password "$GITHUB_TOKEN" \
          --store-password-in-clear-text --configfile "$config"

        cat > "$project" <<EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Salts.Native" Version="[$SALTS_VERSION]" />
            <PackageReference Include="SaltsUtils.Native" Version="[$SALTS_UTILS_VERSION]" />
          </ItemGroup>
        </Project>
        EOF

        dotnet restore "$project" --packages "$packages" --configfile "$config" --no-cache

        salts_root="$packages/salts.native/$SALTS_VERSION/sdk/linux-x64"
        salts_utils_root="$packages/saltsutils.native/$SALTS_UTILS_VERSION/sdk/linux-x64"
        test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
        test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
        test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsTargets.cmake"

        {
          echo "SALTS_VERSION=$SALTS_VERSION"
          echo "SALTS_UTILS_VERSION=$SALTS_UTILS_VERSION"
          echo "SALTS_ROOT=$salts_root"
          echo "SALTS_UTILS_ROOT=$salts_utils_root"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg"
          echo "LD_LIBRARY_PATH=$salts_utils_root/lib:$salts_utils_root/bin:$salts_root/lib"
        } >> "$GITHUB_ENV"

        {
          echo '## Dependency provenance'
          echo "CHttp checked-out head: $(git rev-parse HEAD)"
          echo "Workflow event SHA: $GITHUB_SHA"
          echo "Salts.Native: $SALTS_VERSION"
          echo "SaltsUtils.Native: $SALTS_UTILS_VERSION"
          echo "vcpkg: $(git -C vcpkg rev-parse HEAD)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Restore vcpkg binary archives
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg/archives
        key: chttp-vcpkg-${{ runner.os }}-${{ runner.arch }}-b1b19307-v2

    - name: Set up Go for BoringSSL
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false

    - name: Prepare CHttp toolchain
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config nasm
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
