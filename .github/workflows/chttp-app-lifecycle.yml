# PRs use native-sdk-release.yml for the complete build, CTest and install graph.
name: CHttp App lifecycle qualification

on:
  push:
    branches: [master]
  workflow_dispatch:

# PR qualification checks the proposed head, not GitHub's synthetic merge.
env:
  CHTTP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-app-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Salts SDKs
        uses: ./.github/actions/setup-salts-sdk
        with:
          with-turbowasm: "true"
      - name: Configure exact Chttp head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset ci-linux-dev-user \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
      - name: Install OpenAPI conformance test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -r openapi/tests/requirements-conformance.txt
      - name: Build complete App lifecycle graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset ci-linux-dev-user --parallel 2
      - name: Run focused lifecycle tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --preset ci-linux-dev-user \
            -R '^(chttp_web_(renderer_test|context_test|form_test|form_plan_test|form_plan_boundary_contract|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
      - name: Run OpenAPI DataBind HTTP projection tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --preset ci-linux-dev-user \
            -R '^openapi_databind_http_provider$' \
            --no-tests=error --output-on-failure
      - name: Run Service CMeta admission tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --preset ci-linux-dev-user \
            -R '^chttp_service_(http_test|generated_cflow_http_test|wasm_http_test|generic_cross_tu_test|header_cpp_test|single_materialization_contract|hot_path_boundary_contract)$' \
            --no-tests=error --output-on-failure
      - name: Run RpcService MethodPlan tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --preset ci-linux-dev-user \
            -R '^chttp_rpc_service_(test|header_cpp_test)$' \
            --no-tests=error --output-on-failure
      - name: Run full Chttp CTest graph
        shell: bash
        run: |
          set -euxo pipefail
          ctest --preset ci-linux-dev-user --no-tests=error --output-on-failure
      - name: Verify App lifecycle with AddressSanitizer
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset ci-linux-dev-user \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build --preset ci-linux-dev-user --parallel 2
          ctest --preset ci-linux-dev-user \
            -R '^(chttp_web_(renderer_test|context_test|form_test|form_plan_test|form_plan_boundary_contract|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^chttp_service_(http_test|generated_cflow_http_test|wasm_http_test|generic_cross_tu_test|header_cpp_test)$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^chttp_rpc_service_(test|header_cpp_test)$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^openapi_databind_http_provider$' \
            --no-tests=error --output-on-failure
      - name: Verify App lifecycle with UndefinedBehaviorSanitizer
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          cmake --preset ci-linux-dev-user \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=ON
          cmake --build --preset ci-linux-dev-user --parallel 2
          ctest --preset ci-linux-dev-user \
            -R '^(chttp_web_(renderer_test|context_test|form_test|form_plan_test|form_plan_boundary_contract|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^chttp_service_(http_test|generated_cflow_http_test|wasm_http_test|generic_cross_tu_test|header_cpp_test)$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^chttp_rpc_service_(test|header_cpp_test)$' \
            --no-tests=error --output-on-failure
          ctest --preset ci-linux-dev-user \
            -R '^openapi_databind_http_provider$' \
            --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
