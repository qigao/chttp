name: Component runtime conformance
# Re-run marker: current Component integration head

on:
  push:
    branches:
      - feature/component-runtime-conformance
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-component-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-component:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CHttp integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up released SDK graph and vcpkg cache
        uses: ./.github/actions/setup-salts-sdk
        with:
          with-turbowasm: "false"
          restore-sdks: "false"

      - name: Restore Salts host re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      # Fail closed: only the exact published prerelease and attested source SHA are valid.
      # Never check out, compile or fall back to a stable Salts tree here.
      - name: Restore exact Salts.Native Component candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SALTS_CANDIDATE_VERSION: '3.0.0-cmeta.06fa2b10b418f997c38f123ddefa00e448897617'
          SALTS_CANDIDATE_SHA: '06fa2b10b418f997c38f123ddefa00e448897617'
          SALTS_CANDIDATE_SHA256: '682122da918658bf958fc409dd148157962e128884b21a91df18c5b7e94589ca'
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          config="$RUNNER_TEMP/salts-component-candidate.nuget.config"
          project="$RUNNER_TEMP/salts-component-candidate.csproj"
          packages="$RUNNER_TEMP/salts-component-candidate-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[$SALTS_CANDIDATE_VERSION]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages" \
            --no-cache --force-evaluate
          package="$packages/salts.native/$SALTS_CANDIDATE_VERSION/salts.native.$SALTS_CANDIDATE_VERSION.nupkg"
          printf '%s  %s\n' "$SALTS_CANDIDATE_SHA256" "$package" | sha256sum --check --strict
          root="$packages/salts.native/$SALTS_CANDIDATE_VERSION/sdk/linux-x64"
          manifest="$root/salts-sdk-manifest.txt"
          test -f "$root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$root/include/salts/component_plugin.h"
          test -f "$root/include/salts/component.h"
          test -f "$manifest"
          grep -Fxq "version=$SALTS_CANDIDATE_VERSION" "$manifest"
          grep -Fxq "commit=$SALTS_CANDIDATE_SHA" "$manifest"
          grep -Fxq 'rid=linux-x64' "$manifest"
          grep -Fxq 'profile=candidate' "$manifest"
          grep -Fq 'Salts::ComponentPlugin' "$root/lib/cmake/Salts/SaltsTargets.cmake"

          # Existing dependency-graph restore may have installed a stable Salts.
          # Remove that runtime path so it cannot serve as an implicit fallback.
          previous_salts_root="${SALTS_ROOT:-}"
          ld_path="$root/lib"
          IFS=':' read -r -a ld_entries <<< "${LD_LIBRARY_PATH:-}"
          for entry in "${ld_entries[@]}"; do
            if [ -n "$entry" ] && [ "$entry" != "$previous_salts_root/lib" ] &&
               [ "$entry" != "$previous_salts_root/bin" ]; then
              ld_path="$ld_path:$entry"
            fi
          done
          echo "SALTS_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$ld_path" >> "$GITHUB_ENV"
          echo "Selected exact Salts.Native $SALTS_CANDIDATE_VERSION ($SALTS_CANDIDATE_SHA)"
          
      - name: Checkout SaltsUtils dependency source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: 1c00cab3c5fe4722d4c8488a47f0ada6ec2f3e6b
          path: _deps/salts-utils
          persist-credentials: false

      - name: Rebuild SaltsUtils against the exact candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QIGAO_TARGET_TRIPLET: x64-linux
          QIGAO_SDK_RID: linux-x64
        working-directory: _deps/salts-utils
        run: |
          set -euo pipefail
          cmake --preset ci-sdk-release-user
          cmake --build --preset ci-sdk-release-user -j2
          cmake --build --preset install-ci-sdk-release-user -j2
          root="$GITHUB_WORKSPACE/_deps/salts-utils/stage/sdk/linux-x64"
          printf 'source=%s\nsalts_commit=%s\nsalts_package_sha256=%s\nrid=linux-x64\nprofile=release\n' \
            "$(git rev-parse HEAD)" "06fa2b10b418f997c38f123ddefa00e448897617" "682122da918658bf958fc409dd148157962e128884b21a91df18c5b7e94589ca" > "$root/component-dependency-manifest.txt"
          echo "SALTS_UTILS_ROOT=$root" >> "$GITHUB_ENV"
          echo "DATABIND_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib:$root/bin:$SALTS_ROOT/lib" >> "$GITHUB_ENV"

      - name: Set up compiler cache
        id: compiler-cache
        uses: ./.github/actions/setup-sccache
        with:
          cache-scope: linux-x64-gcc-release

      - name: Configure the complete conformance graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cmake --preset ci-component-release-user

      - name: Build the complete conformance graph
        run: cmake --build --preset ci-component-release-user -j2

      - name: Run Component and adjacent business tests
        run: >-
          ctest --preset ci-component-release-user
          -R '^(chttp_service_http_test|chttp_service_generated_cflow_http_test|chttp_service_generic_cross_tu_test|chttp_service_header_cpp_test)$'
          --no-tests=error --output-on-failure
          --output-junit "$GITHUB_WORKSPACE/build/component-runtime/component-results.xml"

      - name: Install the qualified consumer SDK
        run: cmake --build --preset install-ci-component-release-user -j2

      - name: Verify the installed SDK consumer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: service/tests/installed
        run: |
          set -euo pipefail
          cmake --preset ci-component-installed-user
          cmake --build --preset ci-component-installed-user -j2
          ctest --preset ci-component-installed-user --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/component-runtime/installed-results.xml"

      - name: Finish compiler cache
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: ./.github/actions/finish-sccache

      - name: Record acceptance identities
        if: always()
        shell: bash
        run: |
          mkdir -p build/component-runtime
          printf 'consumer_commit=%s\nsalts_commit=%s\nsalts_package_sha256=%s\n' \
            "$(git rev-parse HEAD)" "06fa2b10b418f997c38f123ddefa00e448897617" "682122da918658bf958fc409dd148157962e128884b21a91df18c5b7e94589ca" > build/component-runtime/acceptance.txt
          if [ -n "${SALTS_UTILS_ROOT:-}" ]; then
            printf 'dependency=SaltsUtils\n' >> build/component-runtime/acceptance.txt
            cat "$SALTS_UTILS_ROOT/component-dependency-manifest.txt" >> build/component-runtime/acceptance.txt
          fi

          printf 'runner_os=%s\nrunner_arch=%s\ncompiler=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$(gcc -dumpfullversion)" >> build/component-runtime/acceptance.txt

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-acceptance-linux-x64
          path: |
            build/component-runtime/acceptance.txt
            build/component-runtime/component-results.xml
            build/component-runtime/installed-results.xml
            build/component-runtime/Testing/Temporary/LastTest.log
            service/tests/installed/build/component-installed/Testing/Temporary/LastTest.log
