name: CHttp Web form binding verification

on:
  push:
    branches:
      - feat/chttp-web-forms
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chttp-web-forms-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SALTS_SHA: 801202e58c2d86b35202414d4812e79a2fd25bae
  SALTS_UTILS_SHA: 8016a93f9b0f14c053ba87ce5a18d40f77fa8770
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout exact public dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git init salts
          git -C salts remote add origin https://github.com/qigao/salts.git
          git -C salts fetch --depth=1 origin "$SALTS_SHA"
          git -C salts checkout --detach FETCH_HEAD
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_SHA"

          git init salts-utils
          git -C salts-utils remote add origin https://github.com/qigao/salts-utils.git
          git -C salts-utils fetch --depth=1 origin "$SALTS_UTILS_SHA"
          git -C salts-utils checkout --detach FETCH_HEAD
          test "$(git -C salts-utils rev-parse HEAD)" = "$SALTS_UTILS_SHA"

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_SHA"
          test "$(git -C vcpkg rev-parse HEAD)" = "$VCPKG_SHA"

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tbe-30-vcpkg-x64-linux-b1b19307-v1

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg
          bash salts-utils/cmake/ci/install-re2c.sh

      - name: Record Salts cache toolchain
        id: salts-toolchain
        shell: bash
        run: echo "key=gcc-$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Salts debug package
        id: salts-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          key: salts-pkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-toolchain.outputs.key }}-debug-801202e58c2d86b35202414d4812e79a2fd25bae-vcpkg-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

      - name: Build and install exact Salts
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Save pinned Salts debug package
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          key: salts-pkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-toolchain.outputs.key }}-debug-801202e58c2d86b35202414d4812e79a2fd25bae-vcpkg-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

      - name: Expose exact Salts profile to SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          test -f "$package/lib/cmake/Salts/SaltsConfig.cmake"
          sudo ln -sfn "$package" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S salts-utils/tools/lemon -B salts-utils/build/host-lemon \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build salts-utils/build/host-lemon --target lemon -j2

      - name: Build and install verified SaltsUtils
        shell: bash
        working-directory: salts-utils
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/salts-utils/build/host-lemon/lemon"
          cmake --build build/linux-gcc-debug --target install -j2
          test -f /opt/salts-utils/debug/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake

      - name: Expose exact SaltsUtils profile to Chttp preset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/salts-project/external/pkgs/salts-utils"
          ln -sfn /opt/salts-utils/debug "$RUNNER_TEMP/salts-project/external/pkgs/salts-utils/debug"
          test -f "$RUNNER_TEMP/salts-project/external/pkgs/salts-utils/debug/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"

      - name: Install OpenAPI conformance test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -r openapi/tests/requirements-conformance.txt

      - name: Configure exact Chttp head
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Audit Server transitive dependency boundary
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_ROOT: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin:${{ runner.temp }}/salts-project/external/pkgs/salts/debug/lib
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/chttp-targets.dot"
          cmake --graphviz="$graph" build/linux-gcc-debug
          python3 - "$graph" <<'PY'
          import re
          import sys
          from collections import defaultdict, deque

          graph_path = sys.argv[1]
          text = open(graph_path, encoding="utf-8").read()
          labels = {
              node: label.replace(r"\n", " ")
              for node, label in re.findall(
                  r'"(node\d+)"\s*\[\s*label\s*=\s*"([^"]+)"', text
              )
          }
          edges = defaultdict(set)
          for src, dst in re.findall(r'"(node\d+)"\s*->\s*"(node\d+)"', text):
              edges[src].add(dst)

          roots = {
              node for node, label in labels.items()
              if "chttp_server" in label or "CHttp::Server" in label
          }
          if not roots:
              raise SystemExit("dependency audit could not find chttp_server")

          queue = deque(roots)
          seen = set(roots)
          while queue:
              node = queue.popleft()
              label = labels.get(node, "")
              if re.search(r"jinja", label, re.IGNORECASE):
                  raise SystemExit(
                      f"CHttp::Server transitively reaches Jinja target: {label}"
                  )
              for dep in edges.get(node, ()):
                  if dep not in seen:
                      seen.add(dep)
                      queue.append(dep)

          print(
              f"CHttp::Server transitive dependency audit passed "
              f"({len(seen)} reachable targets, no Jinja)"
          )
          PY

      - name: Build focused targets
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test chttp_web_form_test \
            chttp_web_example chttp_web_context_example -j2

      - name: Run focused tests
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^chttp_web_(renderer_test|context_test|form_test|http_test|context_http_test)
            --output-on-failure

      - name: Build full Chttp graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2

      - name: Run full Chttp CTest graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Verify web form lifecycle with AddressSanitizer
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test chttp_web_form_test -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^chttp_web_(renderer_test|context_test|form_test)

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
 \
            --output-on-failure

      - name: Build full Chttp graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2

      - name: Run full Chttp CTest graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Verify web context lifecycle with AddressSanitizer
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^chttp_web_(renderer_test|context_test)$' --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
 --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
 \
            --output-on-failure

      - name: Build full Chttp graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2

      - name: Run full Chttp CTest graph
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Verify web context lifecycle with AddressSanitizer
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^chttp_web_(renderer_test|context_test)$' --output-on-failure

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
