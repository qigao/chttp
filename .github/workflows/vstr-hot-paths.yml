name: CHttp Web SSE verification

on:
  push:
    branches:
      - feat/chttp-web-sse
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-web-sse-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up versioned Salts SDKs
        uses: ./.github/actions/setup-salts-sdk
      - name: Install OpenAPI conformance test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -r openapi/tests/requirements-conformance.txt
      - name: Configure exact Chttp head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
      - name: Audit Server transitive dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/chttp-targets.dot"
          cmake --graphviz="$graph" build/linux-gcc-debug
          python3 - "$graph" <<'PYTHON'
          import re
          import sys
          from collections import defaultdict, deque

          graph_path = sys.argv[1]
          text = open(graph_path, encoding="utf-8").read()
          labels = {
              node: label.replace(r"\n", " ")
              for node, label in re.findall(
                  r'"(node\d+)"\s*\[\s*label\s*=\s*"([^"]+)"', text
              )
          }
          edges = defaultdict(set)
          for src, dst in re.findall(r'"(node\d+)"\s*->\s*"(node\d+)"', text):
              edges[src].add(dst)
          roots = {
              node for node, label in labels.items()
              if "chttp_server" in label or "CHttp::Server" in label
          }
          if not roots:
              raise SystemExit("dependency audit could not find chttp_server")
          queue = deque(roots)
          seen = set(roots)
          while queue:
              node = queue.popleft()
              label = labels.get(node, "")
              if re.search(r"jinja", label, re.IGNORECASE):
                  raise SystemExit(f"CHttp::Server transitively reaches Jinja target: {label}")
              for dep in edges.get(node, ()):
                  if dep not in seen:
                      seen.add(dep)
                      queue.append(dep)
          print(f"CHttp::Server transitive dependency audit passed ({len(seen)} reachable targets, no Jinja)")
          generator_roots = {
              node for node, label in labels.items()
              if "openapi_generator" in label or "OpenAPI::Generator" in label
          }
          if not generator_roots:
              raise SystemExit("dependency audit could not find openapi_generator")
          queue = deque(generator_roots)
          generator_seen = set(generator_roots)
          while queue:
              node = queue.popleft()
              label = labels.get(node, "")
              if re.search(r"jinja|chttp_web|CHttp::Web", label, re.IGNORECASE):
                  raise SystemExit(f"OpenAPI generator core reaches Web/Jinja target: {label}")
              for dep in edges.get(node, ()):
                  if dep not in generator_seen:
                      generator_seen.add(dep)
                      queue.append(dep)
          print(f"OpenAPI generator dependency audit passed ({len(generator_seen)} reachable targets, no Web/Jinja)")
          PYTHON
      - name: Audit OpenAPI generic web boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e openapi/ui/renderer.c
          test ! -e openapi/ui/renderer.h
          if grep -R -n -E 'jinja_cmeta|Salts::JinjaCMeta' openapi \
              --include='*.c' --include='*.h' --include='CMakeLists.txt'; then
            echo "OpenAPI production code still owns Jinja directly" >&2
            exit 1
          fi
          grep -q 'CHttp::Web' openapi/examples/CMakeLists.txt
          echo "OpenAPI Jinja ownership audit passed: rendering is owned by CHttp::Web"
      - name: Build focused targets
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target \
            chttp_web_sse_test chttp_server_test \
            chttp_h2_server_test chttp_h2_client_test -j2
      - name: Run focused tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^(chttp_web_sse_test|chttp_server_test|chttp_h2_server_test|chttp_h2_client_test)$' \
            --no-tests=error --output-on-failure
      - name: Build full Chttp graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2
      - name: Run full Chttp CTest graph
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure
      - name: Verify SSE lifecycle with AddressSanitizer
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target \
            chttp_web_sse_test chttp_server_test \
            chttp_h2_server_test chttp_h2_client_test -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^(chttp_web_sse_test|chttp_server_test|chttp_h2_server_test|chttp_h2_client_test)$' \
            --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
