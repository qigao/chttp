name: CHttp ServiceHostCandidate installed macOS dependency consumer

'on':
  push:
    branches: [feature/chttp-servicehost-candidate-224]
    paths:
      - ".github/workflows/chttp-servicehost-macos-consumer.yml"
      - "app/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
  pull_request:
    paths:
      - ".github/workflows/chttp-servicehost-macos-consumer.yml"
      - "app/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-servicehost-macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-consumer:
    name: installed ServiceHostCandidate HTTP (macos-arm64)
    # Salts 2.3.0's exact official six-RID SDK includes macos-arm64 only.
    # macos-x64 is not a published RID; do not try another SDK's architecture.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CHTTP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_CANDIDATE_SHA: 540e1da7c2448f15f04aeaaee1106f73a2fbcc7e

    steps:
      - name: Checkout exact CHttp candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_SOURCE_SHA }}
          persist-credentials: false
      - name: Checkout original Salts-owned ServiceHostCandidate
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 540e1da7c2448f15f04aeaaee1106f73a2fbcc7e
          path: _salts_candidate
          persist-credentials: false
      - name: Install .NET SDK for exact NuGet native dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare AppleClang native toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja
          test -n "$(xcrun --find clang)"
          test -n "$(xcrun --find clang++)"
      - name: Set up exact canonical vcpkg binary-cache contract
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - name: Select native macOS RID and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_SOURCE_SHA"
          test "$(git -C _salts_candidate rev-parse HEAD)" = "$SALTS_CANDIDATE_SHA"
          test -f _salts_candidate/component-runtime/include/salts/service_host.h
          test -f _salts_candidate/component-runtime/src/service_host.c
          # Official Salts Native 2.3.0 six-RID package ships macos-arm64.
          # Enforce Apple Silicon rather than invent an Intel SDK fallback.
          test "$RUNNER_ARCH" = ARM64
          rid=macos-arm64
          triplet=arm64-osx
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in *nugetconfig*) ;;
            *) echo "canonical NuGet read-only cache missing" >&2; exit 1 ;; esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"
          echo "QIGAO_SDK_RID=$rid" >> "$GITHUB_ENV"
          echo "QIGAO_TARGET_TRIPLET=$triplet" >> "$GITHUB_ENV"
          echo "QIGAO_HOST_TRIPLET=$triplet" >> "$GITHUB_ENV"
          echo "macOS target RID=$rid triplet=$triplet"
      - name: Restore exact installed native Salts/SaltsUtils SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash cmake/ci/restore-native-sdks.sh "$QIGAO_SDK_RID"
          test -f "$RUNNER_TEMP/qigao-nuget/salts.native/2.3.0-rc.16/sdk/$QIGAO_SDK_RID/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$RUNNER_TEMP/qigao-nuget/saltsutils.native/4.3.0-rc.11/sdk/$QIGAO_SDK_RID/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
      - name: Configure one-Listener ServiceHostCandidate HTTP consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-macos-sdk-release-user -B build/servicehost-macos \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCHTTP_ENABLE_SERVICE_HOST_CANDIDATE=ON \
            -DCHTTP_SALTS_CANDIDATE_SOURCE_DIR="$GITHUB_WORKSPACE/_salts_candidate" \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_THREAD=OFF \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching
      - name: Verify candidate cannot install or export a public SDK
        shell: bash
        run: |
          set -euo pipefail
          if cmake --build build/servicehost-macos --target install >/dev/null 2>&1; then
            echo "private ServiceHostCandidate install target must be absent" >&2; exit 1
          fi
          test ! -e app/include/chttp_app/service_host_candidate.h
      - name: Compile original Provider DSOs and real MethodPlan tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/servicehost-macos --parallel 2 \
            --target chttp_service_http_test \
                     chttp_service_host_single_listener_test \
                     chttp_service_host_methodplan_switch_test \
                     chttp_service_host_methodplan_h2c_test \
                     chttp_service_host_h2_multiplex_test \
                     chttp_service_host_h2_stream_window_test \
                     chttp_service_host_h2_connection_window_test \
                     chttp_service_host_h2_connection_cancel_test \
                     chttp_service_generated_cflow_http_test
      - name: Execute native macOS H1/H2 and lifecycle conformance
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/servicehost-macos \
            -R '^(chttp_service_http_test|chttp_service_host_single_listener_test|chttp_service_host_methodplan_switch_test|chttp_service_host_methodplan_h2c_test|chttp_service_host_h2_multiplex_test|chttp_service_host_h2_stream_window_test|chttp_service_host_h2_connection_window_test|chttp_service_host_h2_connection_cancel_test|chttp_service_hot_path_boundary_contract|chttp_service_lifecycle_contract|chttp_service_generated_cflow_http_test)$' \
            --repeat until-fail:2 --output-on-failure --no-tests=error --timeout 180
      - name: Assert source and tracked files unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
