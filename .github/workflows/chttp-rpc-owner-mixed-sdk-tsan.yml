name: CHttp RPC Owner exact packaged candidate TSan

'on':
  pull_request:
    paths:
      - ".github/workflows/chttp-rpc-owner-mixed-sdk-tsan.yml"
      - "http_client/**"
      - "http_server/**"
      - "http_common/**"
      - "cmake/**"
      - "presets/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "vcpkg.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-rpc-mixedsdk-tsan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mixed-sdk:
    name: Uninstrumented NuGet candidate SDKs with TSan CHttp
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SALTS: 06ecf2179691e197b108d39ebd12dc994148eada
      EXPECTED_UTILS: 234c4a73bcefc455d48b3550ec2142d7ff1c3f5a
      EXPECTED_CHTTP: ${{ github.event.pull_request.head.sha || github.sha }}
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      CCACHE_DIR: ${{ github.workspace }}/build/rpc-mixed-sdk-tsan/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Checkout exact CHttp RPC Owner head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CHTTP }}
          persist-credentials: false
      - name: Checkout exact unpublished Salts source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.EXPECTED_SALTS }}
          path: build/rpc-mixed-sdk-tsan/sources/salts
          persist-credentials: false
      - name: Checkout immutable SaltsUtils source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.EXPECTED_UTILS }}
          path: build/rpc-mixed-sdk-tsan/sources/salts-utils
          persist-credentials: false
      - name: Use pinned shared vcpkg dependency graph
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Restore re2c host generator
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Prepare native host tools
        uses: ./build/rpc-mixed-sdk-tsan/sources/salts/.github/actions/setup-build-host
      - name: Check exact first-party source identities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ccache
          mkdir -p build/rpc-mixed-sdk-tsan
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          test "$(git -C build/rpc-mixed-sdk-tsan/sources/salts rev-parse HEAD)" = "$EXPECTED_SALTS"
          test "$(git -C build/rpc-mixed-sdk-tsan/sources/salts-utils rev-parse HEAD)" = "$EXPECTED_UTILS"
          {
            printf 'chttp_source=%s\n' "$EXPECTED_CHTTP"
            printf 'salts_source=%s\n' "$EXPECTED_SALTS"
            printf 'saltsutils_source=%s\n' "$EXPECTED_UTILS"
            printf 'qualification=packaged-candidate-native-sdk-tsan\n'
            printf 'sdk_published=false\n'
            printf 'native_salts_tsan=false\n'
          } | tee build/rpc-mixed-sdk-tsan/provenance.txt
      - name: Verify POSIX once barrier candidate identity
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'pthread_once(&guard->native, callback)' \
            build/rpc-mixed-sdk-tsan/sources/salts/platform/src/thread_posix.c
          grep -qF 'pthread_once_t native;' \
            build/rpc-mixed-sdk-tsan/sources/salts/platform/include/salts/thread.h

      - name: Build and install uninstrumented candidate Salts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chttp-mixed-tsan/salts"
          cmake --preset linux-release-ci -S "$GITHUB_WORKSPACE/build/rpc-mixed-sdk-tsan/sources/salts" \
            -B build/rpc-mixed-sdk-tsan/build-salts \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$root" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=OFF -DENABLE_SANITIZER_ADDRESS=OFF
          cmake --build build/rpc-mixed-sdk-tsan/build-salts --parallel 2
          cmake --install build/rpc-mixed-sdk-tsan/build-salts
          test -f "$root/lib/cmake/Salts/SaltsConfig.cmake"

      - name: Build and install uninstrumented candidate SaltsUtils
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-mixed-tsan/salts"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          src="$GITHUB_WORKSPACE/build/rpc-mixed-sdk-tsan/sources/salts-utils"
          root="$RUNNER_TEMP/chttp-mixed-tsan/salts-utils"
          cmake --preset ci-linux-release-user -S "$src" \
            -B build/rpc-mixed-sdk-tsan/build-utils \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$root" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/rpc-mixed-sdk-tsan/build-utils --parallel 2
          cmake --install build/rpc-mixed-sdk-tsan/build-utils
          test -f "$root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" build/rpc-mixed-sdk-tsan/build-utils/CMakeCache.txt

      - name: Set up package tooling (no feed publication)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack, attest and extract exact unpublished native NuGet candidates
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/chttp-mixed-tsan"
          stage="$base/pack-stage"
          dist="$GITHUB_WORKSPACE/build/rpc-mixed-sdk-tsan/dist"
          mkdir -p "$stage/salts/sdk/linux-x64" "$stage/utils/sdk/linux-x64" "$dist"
          cp -a "$base/salts/." "$stage/salts/sdk/linux-x64/"
          cp -a "$base/salts-utils/." "$stage/utils/sdk/linux-x64/"
          salts_version="2.3.0-cnet.once.sha$EXPECTED_SALTS"
          utils_version="4.3.0-cnet.once.sha$EXPECTED_UTILS.salts.sha$EXPECTED_SALTS"
          printf 'version=%s\ncommit=%s\nrid=linux-x64\nprofile=candidate\n' \
            "$salts_version" "$EXPECTED_SALTS" \
            > "$stage/salts/sdk/linux-x64/salts-sdk-manifest.txt"
          printf 'version=%s\ncommit=%s\nrid=linux-x64\nprofile=candidate\nsalts_commit=%s\n' \
            "$utils_version" "$EXPECTED_UTILS" "$EXPECTED_SALTS" \
            > "$stage/utils/sdk/linux-x64/salts-utils-sdk-manifest.txt"
          dotnet pack build/rpc-mixed-sdk-tsan/sources/salts/packaging/nuget/Salts.Native.csproj \
            --configuration Release --output "$dist" \
            "-p:PackageVersion=$salts_version" "-p:PackageRoot=$stage/salts" \
            "-p:RepositoryCommit=$EXPECTED_SALTS"
          dotnet pack build/rpc-mixed-sdk-tsan/sources/salts-utils/packaging/nuget/SaltsUtils.Native.csproj \
            --configuration Release --output "$dist" \
            "-p:PackageVersion=$utils_version" "-p:PackageRoot=$stage/utils" \
            "-p:RepositoryCommit=$EXPECTED_UTILS"
          python3 - "$dist" "$base" "$salts_version" "$utils_version" \
            "$EXPECTED_SALTS" "$EXPECTED_UTILS" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys
          import tempfile
          from xml.etree import ElementTree
          import zipfile

          dist, base = map(Path, sys.argv[1:3])
          salts_version, utils_version, salts_sha, utils_sha = sys.argv[3:]
          # SaltsUtils release packaging preserves the executable bit on host
          # IDL compilers. The source helper expects six RIDs; this candidate
          # intentionally packages only Linux x64.
          utils_pkg = dist / f"SaltsUtils.Native.{utils_version}.nupkg"
          tool = "sdk/linux-x64/bin/salts-idlc"
          with zipfile.ZipFile(utils_pkg) as original:
              if tool not in original.namelist():
                  raise SystemExit(f"Missing IDL compiler in {utils_pkg.name}")
              fd, name = tempfile.mkstemp(suffix=".nupkg", dir=dist)
              os.close(fd)
              temp = Path(name)
              try:
                  with zipfile.ZipFile(temp, "w", allowZip64=True) as output:
                      output.comment = original.comment
                      for info in original.infolist():
                          if info.filename == tool:
                              info.create_system = 3
                              info.external_attr = (stat.S_IFREG | 0o755) << 16
                          output.writestr(info, original.read(info.filename))
                  os.replace(temp, utils_pkg)
              finally:
                  temp.unlink(missing_ok=True)

          results = []
          for package_id, version, sha, manifest, required in (
              ("Salts.Native", salts_version, salts_sha,
               "salts-sdk-manifest.txt",
               ("lib/cmake/Salts/SaltsConfig.cmake",
                "include/salts/thread.h", "lib/libcnet.so")),
              ("SaltsUtils.Native", utils_version, utils_sha,
               "salts-utils-sdk-manifest.txt",
               ("lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake",
                "include/data_bind_native_binding.h",
                "bin/salts-idlc")),
          ):
              pkg = dist / f"{package_id}.{version}.nupkg"
              target = base / "extracted" / package_id / "sdk" / "linux-x64"
              with zipfile.ZipFile(pkg) as archive:
                  names = archive.namelist()
                  prefix = "sdk/linux-x64/"
                  matches = [n for n in names if n.endswith("/" + manifest)]
                  if matches != [prefix + manifest]:
                      raise SystemExit(f"{pkg.name}: manifest set {matches!r}")
                  for suffix in required:
                      if prefix + suffix not in names:
                          raise SystemExit(f"{pkg.name}: missing {suffix}")
                  nuspec = [n for n in names if n.endswith(".nuspec")]
                  if len(nuspec) != 1:
                      raise SystemExit(f"{pkg.name}: invalid nuspec set")
                  root = ElementTree.fromstring(archive.read(nuspec[0]))
                  meta = {tag.tag.rsplit("}", 1)[-1]: tag.text
                          for tag in root.iter()
                          if tag.tag.rsplit("}", 1)[-1] in ("id", "version")}
                  if (meta.get("id"), meta.get("version")) != (package_id, version):
                      raise SystemExit(f"{pkg.name}: wrong NuGet identity {meta}")
                  facts = dict(line.split("=", 1)
                               for line in archive.read(prefix + manifest).decode().splitlines()
                               if "=" in line)
                  expected = {"version": version, "commit": sha,
                              "rid": "linux-x64", "profile": "candidate"}
                  if package_id == "SaltsUtils.Native":
                      expected["salts_commit"] = salts_sha
                  if facts != expected:
                      raise SystemExit(f"{pkg.name}: incorrect candidate manifest {facts}")
                  if package_id == "Salts.Native":
                      header = archive.read(prefix + "include/salts/thread.h")
                      if b"pthread_once_t native;" not in header:
                          raise SystemExit("Packaged Salts ABI lacks POSIX pthread_once")
                  else:
                      mode = (archive.getinfo(prefix + "bin/salts-idlc").external_attr >> 16) & 0o777
                      if mode & 0o111 != 0o111:
                          raise SystemExit("Packaged salts-idlc lacks executable permission")
                  for entry in archive.infolist():
                      if not entry.filename.startswith(prefix):
                          continue
                      subpath = entry.filename[len(prefix):]
                      if not subpath:
                          continue
                      p = Path(subpath)
                      if p.is_absolute() or ".." in p.parts:
                          raise SystemExit(f"Unsafe package entry {entry.filename!r}")
                      output = target / p
                      if entry.is_dir():
                          output.mkdir(parents=True, exist_ok=True)
                      else:
                          output.parent.mkdir(parents=True, exist_ok=True)
                          output.write_bytes(archive.read(entry))
                          mode = (entry.external_attr >> 16) & 0o777
                          if mode:
                              output.chmod(mode)
              digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
              results.append(f"{package_id}={version}\n{package_id}_sha256={digest}\n")
              print(f"Qualified packaged {package_id} {version} sha256={digest}")
          (dist / "candidate-nupkg-provenance.txt").write_text(
              f"salts_source={salts_sha}\nsaltsutils_source={utils_sha}\n"
              "published=false\nused_after_extraction=true\n" + "".join(results))
          PY
          test -x "$base/extracted/SaltsUtils.Native/sdk/linux-x64/bin/salts-idlc"
          test -f "$base/extracted/Salts.Native/sdk/linux-x64/lib/libcnet.so"
          # No producer-install fallback: consumer must link the extracted
          # packages, and never find its original staging trees.
          rm -rf "$base/salts" "$base/salts-utils"
          test ! -e "$base/salts/lib/cmake/Salts/SaltsConfig.cmake"
          test ! -e "$base/salts-utils/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          cat "$dist/candidate-nupkg-provenance.txt" | tee -a build/rpc-mixed-sdk-tsan/provenance.txt

      - name: Build source-instrumented CHttp against ordinary native SDK
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-mixed-tsan/extracted/Salts.Native/sdk/linux-x64"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/chttp-mixed-tsan/extracted/SaltsUtils.Native/sdk/linux-x64"
          export DATABIND_ROOT="$SALTS_UTILS_ROOT"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          src="$GITHUB_WORKSPACE"
          cmake --preset ci-linux-release-user -S "$src" \
            -B build/rpc-mixed-sdk-tsan/build-chttp \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/rpc-mixed-sdk-tsan/build-chttp --parallel 2 \
            --target crpc_transport_test crpc_server_test chttp_rpc_service_test \
                     crpc_api_test chttp_server_test chttp_h2_client_test \
                     chttp_rpc_owned_native_test
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" build/rpc-mixed-sdk-tsan/build-chttp/CMakeCache.txt
          grep -F "SaltsUtils_DIR:PATH=$SALTS_UTILS_ROOT" build/rpc-mixed-sdk-tsan/build-chttp/CMakeCache.txt

      - name: Audit native SDK and consumer instrumentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/rpc-mixed-sdk-tsan/instrumentation.txt
          import json
          from pathlib import Path
          base=Path("build/rpc-mixed-sdk-tsan")
          stages=(
              ("Salts native", "build-salts", False, ("cnet/src/cnet_module.c", "platform/src/thread_posix.c")),
              ("SaltsUtils native", "build-utils", False, ("databind/runtime/data_bind_binding_plan.c",)),
              ("CHttp client", "build-chttp", True, ("http_client/src/chttp_client.c", "http_server/src/chttp_server.c", "http_server/rpc/chttp_server_rpc_service.c", "http_server/tests/rpc_generated/chttp_rpc_owned_native_test.c")),
          )
          for label, folder, expect_tsan, required in stages:
              cmds=json.loads((base / folder / "compile_commands.json").read_text())
              actual=[c for c in cmds if "-fsanitize=thread" in (c.get("command") or " ".join(c.get("arguments", [])))]
              print(f"{label}: units={len(cmds)} instrumented={len(actual)} required_tsan={expect_tsan}")
              if not cmds or len(actual) != (len(cmds) if expect_tsan else 0):
                  raise SystemExit(f"{label} has mismatched instrumentation")
              for name in required:
                  if not any(c["file"].endswith(name) for c in cmds):
                      raise SystemExit(f"{label} missing source {name}")
          PY
          root="$RUNNER_TEMP/chttp-mixed-tsan/extracted/Salts.Native/sdk/linux-x64"
          if readelf -d "$root/lib/libcnet.so" | grep -q libtsan; then
            echo "candidate native CNet unexpectedly needs libtsan" >&2
            exit 1
          fi
          ldd build/rpc-mixed-sdk-tsan/build-chttp/bin/crpc_transport_test \
            | tee build/rpc-mixed-sdk-tsan/consumer-ldd.txt
          grep -F "$root/lib" build/rpc-mixed-sdk-tsan/consumer-ldd.txt
          grep -q libtsan build/rpc-mixed-sdk-tsan/consumer-ldd.txt
      - name: Repeat mixed-instrumentation RPC/Owner TSan unsuppressed
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-mixed-tsan/extracted/Salts.Native/sdk/linux-x64"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/chttp-mixed-tsan/extracted/SaltsUtils.Native/sdk/linux-x64"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          timeout --signal=TERM --kill-after=10s 480s \
            ctest --test-dir build/rpc-mixed-sdk-tsan/build-chttp \
            -R '^(crpc_transport_test|crpc_server_test|chttp_rpc_service_test|crpc_api_test|chttp_server_test|chttp_h2_client_test|chttp_rpc_owned_native_test)$' \
            --repeat until-fail:5 --timeout 90 --no-tests=error --output-on-failure
      - name: Preserve exact source-graph qualifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chttp-245-rpc-owner-mixedsdk-tsan
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rpc-mixed-sdk-tsan/provenance.txt
            build/rpc-mixed-sdk-tsan/dist/*.nupkg
            build/rpc-mixed-sdk-tsan/dist/candidate-nupkg-provenance.txt
            build/rpc-mixed-sdk-tsan/instrumentation.txt
            build/rpc-mixed-sdk-tsan/consumer-ldd.txt
            build/rpc-mixed-sdk-tsan/build-chttp/Testing/Temporary/LastTest.log
      - name: Verify CHttp HEAD remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          test -z "$(git status --porcelain --untracked-files=no)"
