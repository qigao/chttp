name: CHttp RPC Owner exact six-RID upstream NuGet consumer TSan

'on':
  pull_request:
    paths:
      - ".github/workflows/chttp-rpc-owner-exact-upstream-nupkg-tsan.yml"
      - "http_client/**"
      - "http_server/**"
      - "http_common/**"
      - "app/tests/installed/**"
      - "cmake/**"
      - "presets/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: chttp-rpc-upstream-nupkg-tsan-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-upstream-packages:
    name: Uninstrumented exact six-RID NuGet pair with TSan CHttp + installed SDK
    # This workflow preserves Draft PR #245's candidate-package evidence. Its
    # source artifacts are not a reusable current-release dependency feed.
    if: >-
      github.repository == 'qigao/chttp' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 245 &&
      github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_CHTTP: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SALTS: 21bdb1145fbb2b39ee3fa644173ec037adba7b87
      EXPECTED_UTILS: 01cbc2f0e9566927331e783c1246e9d61636e6a6
      SALTS_RUN_ID: "38248972051"
      UTILS_RUN_ID: "38250938281"
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      CCACHE_DIR: ${{ github.workspace }}/build/rpc-nupkg-tsan/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      QIGAO_SDK_RID: linux-x64
      QIGAO_TARGET_TRIPLET: x64-linux
      QIGAO_HOST_TRIPLET: x64-linux
    steps:
      - name: Checkout exact CHttp Draft source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable Salts host-action tools only
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 21bdb1145fbb2b39ee3fa644173ec037adba7b87
          path: build/rpc-nupkg-tsan/salts-build-host
          persist-credentials: false
      - name: Use pinned shared vcpkg dependency graph
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Restore re2c host generator
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Prepare Linux build host
        uses: ./build/rpc-nupkg-tsan/salts-build-host/.github/actions/setup-build-host

      - name: Restore and attest exact previously packaged NuGet pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ccache
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          mkdir -p build/rpc-nupkg-tsan/dist
          gh api "repos/qigao/salts/actions/runs/$SALTS_RUN_ID" \
            > build/rpc-nupkg-tsan/salts-run.json
          gh api "repos/qigao/salts-utils/actions/runs/$UTILS_RUN_ID" \
            > build/rpc-nupkg-tsan/utils-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          checks = (
              ("salts", "qigao/salts", ".github/workflows/cnet-once-six-rid-candidate.yml",
               "test/cnet-module-once-tsan-1143", 1150, os.environ["EXPECTED_SALTS"]),
              ("utils", "qigao/salts-utils", ".github/workflows/cnet-once-six-rid-candidate.yml",
               "test/cnet-once-six-rid-sdk-1143", 623, os.environ["EXPECTED_UTILS"]),
          )
          for key, repo, workflow, branch, pr, sha in checks:
              run = json.loads(Path(f"build/rpc-nupkg-tsan/{key}-run.json").read_text())
              expected = {"path": workflow, "head_sha": sha,
                          "head_branch": branch, "event": "pull_request",
                          "status": "completed", "conclusion": "success"}
              for field, want in expected.items():
                  if run.get(field) != want:
                      raise SystemExit(f"{key} producer {field}: {run.get(field)} != {want}")
              if run["repository"]["full_name"] != repo or not any(
                  p["number"] == pr and p["head"]["sha"] == sha
                  for p in run.get("pull_requests", [])):
                  raise SystemExit(f"{key} producer PR identity mismatch")
          PY
          gh run download "$SALTS_RUN_ID" --repo qigao/salts \
            --name salts-native-nuget --dir build/rpc-nupkg-tsan/dist
          gh run download "$UTILS_RUN_ID" --repo qigao/salts-utils \
            --name salts-utils-native-nuget --dir build/rpc-nupkg-tsan/dist
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import zipfile
          from xml.etree import ElementTree

          salts = os.environ["EXPECTED_SALTS"]
          utils = os.environ["EXPECTED_UTILS"]
          dist = Path("build/rpc-nupkg-tsan/dist")
          runtime = Path(os.environ["RUNNER_TEMP"]) / "chttp-exact-nupkgs"
          rids = ("linux-x64", "linux-arm64", "windows-x64", "macos-arm64",
                  "android-arm64-v8a", "ios-arm64")
          pairs = (
              ("Salts.Native", "2.3.0-cnet.once.sha" + salts,
               "aba3cc5242a80c162daa9155cdf8986baaa308d74e476db3d2982d9e263e1100",
               "salts-sdk-manifest.txt", salts, runtime / "salts"),
              ("SaltsUtils.Native", "4.3.0-cnet.once.sha" + utils + ".salts.sha" + salts,
               "9449f11acde09f55a70d0855af297079bda1003271d573f1533a7bb88fec3bb1",
               "salts-utils-sdk-manifest.txt", utils, runtime / "utils"),
          )
          facts = [f"salts_source={salts}", f"saltsutils_source={utils}",
                   "candidate_published=false", "consumer_uses_unpacked_nupkg=true"]
          for package_id, version, expected_digest, manifest_name, sha, output_root in pairs:
              pkg = dist / f"{package_id}.{version}.nupkg"
              if not pkg.is_file():
                  raise SystemExit(f"Missing exact NuGet package {pkg}")
              digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(f"{package_id} SHA256 mismatch: {digest}")
              with zipfile.ZipFile(pkg) as archive:
                  names = set(archive.namelist())
                  manifests = {n for n in names if n.endswith("/" + manifest_name)}
                  expected = {f"sdk/{rid}/{manifest_name}" for rid in rids}
                  if manifests != expected:
                      raise SystemExit(f"{package_id} wrong RID manifests: {manifests ^ expected}")
                  specs = [n for n in names if n.endswith(".nuspec")]
                  if len(specs) != 1:
                      raise SystemExit(f"{package_id} NuGet identity missing")
                  metadata = {n.tag.rsplit("}", 1)[-1]: n.text
                              for n in ElementTree.fromstring(archive.read(specs[0])).iter()
                              if n.tag.rsplit("}", 1)[-1] in ("id", "version")}
                  if (metadata.get("id"), metadata.get("version")) != (package_id, version):
                      raise SystemExit(f"{package_id} NuGet ID/version mismatch")
                  for rid in rids:
                      prefix = f"sdk/{rid}/"
                      manifest = dict(line.split("=", 1) for line in
                          archive.read(prefix + manifest_name).decode("utf-8-sig").splitlines()
                          if "=" in line)
                      expected_facts = [("version", version), ("commit", sha), ("profile", "release")]
                      if package_id == "SaltsUtils.Native":
                          expected_facts.append(("salts_version", "candidate-" + salts))
                      for key, want in expected_facts:
                          if manifest.get(key) != want:
                              raise SystemExit(f"{package_id}/{rid}: {key} incorrect")
                  if package_id == "Salts.Native" and \
                          b"pthread_once_t native;" not in archive.read(
                              "sdk/linux-x64/include/salts/thread.h"):
                      raise SystemExit("Packed Salts CMeta pthread_once ABI missing")
                  prefix = "sdk/linux-x64/"
                  for member in archive.infolist():
                      if not member.filename.startswith(prefix):
                          continue
                      relative = member.filename[len(prefix):]
                      if not relative:
                          continue
                      path = Path(relative)
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit("Unsafe archive member")
                      target = output_root / "sdk" / "linux-x64" / path
                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(archive.read(member))
                          mode = (member.external_attr >> 16) & 0o777
                          if mode:
                              target.chmod(mode)
              assert (output_root / "sdk/linux-x64").is_dir()
              facts += [f"{package_id}_version={version}",
                        f"{package_id}_sha256={digest}"]
          sr = runtime / "salts/sdk/linux-x64"
          ur = runtime / "utils/sdk/linux-x64"
          if not (sr / "lib/cmake/Salts/SaltsConfig.cmake").is_file():
              raise SystemExit("Missing Salts package CMake config")
          if not (ur / "lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake").is_file():
              raise SystemExit("Missing SaltsUtils package CMake config")
          compiler = ur / "bin/salts-idlc"
          if not compiler.is_file():
              raise SystemExit("Missing extracted IDL compiler")
          compiler.chmod(compiler.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SALTS_ROOT={sr}\nSALTS_UTILS_ROOT={ur}\nDATABIND_ROOT={ur}\n")
              env.write(f"LD_LIBRARY_PATH={ur}/lib:{ur}/bin:{sr}/lib:"
                        f"{os.environ['GITHUB_WORKSPACE']}/vcpkg_installed/x64-linux/lib:"
                        f"{os.environ.get('LD_LIBRARY_PATH','')}\n")
          with open(os.environ["GITHUB_PATH"], "a") as env:
              env.write(str(ur / "bin") + "\n")
          (dist / "provenance.txt").write_text("\n".join(facts) + "\n")
          print("\n".join(facts))
          PY

      - name: Build CHttp TSan consumer against unpacked packages only
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          cmake --preset ci-linux-release-user -S "$GITHUB_WORKSPACE" \
            -B build/rpc-nupkg-tsan/build-chttp \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/rpc-nupkg-tsan/build-chttp --parallel 2 \
            --target crpc_transport_test crpc_server_test chttp_rpc_service_test \
                     crpc_api_test chttp_server_test chttp_h2_client_test \
                     chttp_rpc_owned_native_test
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" build/rpc-nupkg-tsan/build-chttp/CMakeCache.txt
          grep -F "SaltsUtils_DIR:PATH=$SALTS_UTILS_ROOT" build/rpc-nupkg-tsan/build-chttp/CMakeCache.txt

      - name: Enforce instrumentation and exact packaged dynamic links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/rpc-nupkg-tsan/instrumentation.txt
          import json
          from pathlib import Path
          cmds = json.loads(Path("build/rpc-nupkg-tsan/build-chttp/compile_commands.json").read_text())
          instrumented = [c for c in cmds
              if "-fsanitize=thread" in (c.get("command") or " ".join(c.get("arguments", [])))]
          required = ("http_client/src/chttp_client.c", "http_server/src/chttp_server.c",
                      "http_server/rpc/chttp_server_rpc_service.c",
                      "http_server/tests/rpc_generated/chttp_rpc_owned_native_test.c")
          print(f"chttp_firstparty={len(cmds)} instrumented={len(instrumented)}")
          if not cmds or len(cmds) != len(instrumented):
              raise SystemExit("Missing CHttp TSan instrumentation")
          for name in required:
              if not any(c["file"].endswith(name) for c in cmds):
                  raise SystemExit(f"Missing tested CHttp source: {name}")
          PY
          if readelf -d "$SALTS_ROOT/lib/libcnet.so" | grep -q libtsan; then
            echo 'Expected an ordinary uninstrumented candidate CNet DSO' >&2
            exit 1
          fi
          ldd build/rpc-nupkg-tsan/build-chttp/bin/crpc_transport_test \
            | tee build/rpc-nupkg-tsan/consumer-ldd.txt
          grep -F "$SALTS_ROOT/lib" build/rpc-nupkg-tsan/consumer-ldd.txt
          grep -F "$SALTS_UTILS_ROOT/lib" build/rpc-nupkg-tsan/consumer-ldd.txt
          grep -q libtsan build/rpc-nupkg-tsan/consumer-ldd.txt

      - name: Repeat RPC Owner mixed-package TSan tests without suppressions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 480s \
            ctest --test-dir build/rpc-nupkg-tsan/build-chttp \
            -R '^(crpc_transport_test|crpc_server_test|chttp_rpc_service_test|crpc_api_test|chttp_server_test|chttp_h2_client_test|chttp_rpc_owned_native_test)$' \
            --repeat until-fail:5 --timeout 90 --no-tests=error --output-on-failure

      - name: Build and install CHttp SDK against packaged dependencies
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/rpc-nupkg-tsan/build-chttp --parallel 2
          cmake --install build/rpc-nupkg-tsan/build-chttp \
            --prefix "$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          test -f stage/sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake
          ! grep -q 'CHttp::RpcService' stage/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake

      - name: Qualify installed C11/C++ App consumer
        shell: bash
        working-directory: app/tests/installed
        run: |
          set -euo pipefail
          # Installed CHttp libraries carry TSan in this qualification; the
          # installed consumers must use the same ABI/link instrumentation.
          cmake --preset installed-release-user \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          grep -q -- '-fsanitize=thread' build/release/compile_commands.json
          cmake --build --preset installed-release-user --parallel 2
          ctest --preset installed-release-user --no-tests=error --output-on-failure

      - name: Preserve exact package + SDK/TSan qualifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chttp-245-upstream-six-rid-nupkg-tsan
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rpc-nupkg-tsan/dist/*.nupkg
            build/rpc-nupkg-tsan/dist/provenance.txt
            build/rpc-nupkg-tsan/instrumentation.txt
            build/rpc-nupkg-tsan/consumer-ldd.txt
            build/rpc-nupkg-tsan/build-chttp/Testing/Temporary/LastTest.log
            app/tests/installed/build/release/Testing/Temporary/LastTest.log

      - name: Verify unchanged exact CHttp source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          test -z "$(git status --porcelain --untracked-files=no)"


  exact-rid-consumers:
    name: Exact candidate installed CHttp SDK / ${{ matrix.rid }}
    if: >-
      github.repository == 'qigao/chttp' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 245 &&
      github.event.pull_request.draft
    needs: exact-upstream-packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, family: linux, rid: linux-x64, host_rid: linux-x64, triplet: x64-linux, host_triplet: x64-linux, preset: ci-sdk-release-user, cross: false}
          - {runner: ubuntu-24.04-arm, family: linux, rid: linux-arm64, host_rid: linux-arm64, triplet: arm64-linux, host_triplet: arm64-linux, preset: ci-sdk-release-user, cross: false}
          - {runner: windows-latest, family: windows, rid: windows-x64, host_rid: windows-x64, triplet: x64-windows, host_triplet: x64-windows, preset: ci-sdk-release-user, cross: false}
          - {runner: macos-15, family: macos, rid: macos-arm64, host_rid: macos-arm64, triplet: arm64-osx, host_triplet: arm64-osx, preset: ci-macos-sdk-release-user, cross: false}
          - {runner: ubuntu-24.04, family: android, rid: android-arm64-v8a, host_rid: linux-x64, triplet: arm64-android, host_triplet: x64-linux, preset: ci-android-sdk-release-user, cross: true}
          - {runner: macos-15, family: ios, rid: ios-arm64, host_rid: macos-arm64, triplet: arm64-ios, host_triplet: arm64-osx, preset: ci-ios-sdk-release-user, cross: true}
    env:
      EXPECTED_CHTTP: ${{ github.event.pull_request.head.sha }}
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      QIGAO_IOS_SYSROOT: iphoneos
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select canonical iOS binary cache namespace
        if: matrix.family == 'ios'
        shell: bash
        run: echo 'X_VCPKG_NUGET_ID_PREFIX=vcpkg-cache' >> "$GITHUB_ENV"
      - name: Install OpenAPI conformance test prerequisites
        if: matrix.cross == false
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r openapi/tests/requirements-conformance.txt
      - name: Configure canonical vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Restore independent re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Require matching vcpkg target and host architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VCPKG_CACHE_REPOSITORY_ROOT -or
              -not (Test-Path (Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT 'cmake/QigaoVcpkgToolchain.cmake') -PathType Leaf)) {
            throw 'Missing canonical vcpkg toolchain'
          }
          if ($env:RUNNER_OS -eq 'Windows') {
            if (-not $env:QIGAO_VCPKG_WINDOWS_TRIPLET -or -not $env:QIGAO_VCPKG_WINDOWS_HOST_TRIPLET) {
              throw 'Missing Windows vcpkg triplets'
            }
            "QIGAO_TARGET_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
            "QIGAO_HOST_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_HOST_TRIPLET" >> $env:GITHUB_ENV
          }
          if ($env:RUNNER_OS -eq 'macOS' -and $env:RUNNER_ARCH -ne 'ARM64') {
            throw 'macOS runner must match arm64 SDK host'
          }
      - name: Prepare native Linux and Android toolchain
        if: matrix.family == 'linux' || matrix.family == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config ccache
          if [[ "${{ matrix.family }}" == android ]]; then test -n "$ANDROID_NDK_HOME"; fi
      - name: Prepare Apple native and iOS toolchain
        if: matrix.family == 'macos' || matrix.family == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install ninja nasm ccache
          xcrun --find clang
      - name: Prepare Windows x64 MSVC toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nasm ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Missing Windows compiler tools' }
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'MSVC x64 unavailable' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
      - name: Restore exact six-RID unpublished Salts and SaltsUtils NuGet pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          python3 cmake/ci/restore-cnet-once-six-rid-nupkgs.py \
            --rid "${{ matrix.rid }}" --host-rid "${{ matrix.host_rid }}"
      - name: Restore exact-candidate compiler object cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: cnet-once-nupkg-${{ matrix.rid }}
          sdk_identity: cnet-once-21bdb114-utils-01cbc2f0
      - name: Build / CTest / install exact-candidate CHttp SDK on Unix
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          tests=ON
          if [[ "${{ matrix.cross }}" == true ]]; then tests=OFF; fi
          # The Linux arm64 SDK is a new native CHttp consumer profile.
          # Its exact llhttp/tree-sitter vcpkg ABI binaries are not yet cached;
          # build those immutable ports from source instead of weakening any
          # tested SDK identity or using a published/legacy runtime.
          set --
          if [[ "${{ matrix.rid }}" == linux-arm64 ]]; then
            set -- "-DVCPKG_INSTALL_OPTIONS="
          fi
          cmake --preset "${{ matrix.preset }}" \
            -DBUILD_TESTING="$tests" -DBUILD_TESTS="$tests" \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            "-DSaltsUtils_IDLC_EXECUTABLE=$EXACT_SALTS_IDLC" \
            "-DSaltsUtils_IDLC_HOST_SALTS_ROOT=$SALTS_HOST_ROOT" "$@"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          if [[ "${{ matrix.cross }}" != true ]]; then
            ctest --preset "${{ matrix.preset }}" --output-on-failure \
              --no-tests=error --timeout 90 --stop-on-failure
          fi
          # The one-slot WebSocket io_uring generation-reuse case must also
          # withstand repeated first-close -> terminal-observation -> reconnect.
          # Keep it as a hard CTest (no retries on failed connections/suppression).
          if [[ "${{ matrix.rid }}" == linux-x64 ]]; then
            timeout --signal=TERM --kill-after=10s 300s \
              ctest --preset "${{ matrix.preset }}" \
              -R '^chttp_websocket_io_uring_test$' \
              --repeat until-fail:15 --no-tests=error \
              --timeout 90 --output-on-failure
          fi
          cmake --build --preset "install-${{ matrix.preset }}"
      - name: Build / CTest / install exact-candidate CHttp SDK on Windows
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\%QIGAO_TARGET_TRIPLET%\bin;%PATH%"
          cmake --preset ci-sdk-release-user -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE "-DSaltsUtils_IDLC_EXECUTABLE=%EXACT_SALTS_IDLC%"
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-sdk-release-user --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset ci-sdk-release-user --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
          cmake --build --preset install-ci-sdk-release-user
          if errorlevel 1 exit /b 1
      - name: Installed C11/C++ App and RPC consumer contracts on Unix
        if: matrix.family == 'linux' || matrix.family == 'macos'
        working-directory: app/tests/installed
        shell: bash
        run: |
          set -euo pipefail
          preset=installed-release-user
          if [[ "${{ matrix.family }}" == macos ]]; then preset=installed-macos-release-user; fi
          # An installed consumer configures a second CMake/vcpkg graph.
          # Linux arm64 must use the same immutable source-build policy as
          # the producer, because its llhttp/tree-sitter ABIs are not cached.
          set --
          if [[ "${{ matrix.rid }}" == linux-arm64 ]]; then
            set -- "-DVCPKG_INSTALL_OPTIONS="
          fi
          cmake --preset "$preset" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE "$@"
          cmake --build --preset "$preset" --parallel 2
          ctest --preset "$preset" --output-on-failure --no-tests=error
      - name: Installed C11/C++ App and RPC consumer contracts on Windows
        if: matrix.family == 'windows'
        shell: cmd
        working-directory: app/tests/installed
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\%QIGAO_TARGET_TRIPLET%\bin;%PATH%"
          cmake --preset installed-release-user -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE
          if errorlevel 1 exit /b 1
          cmake --build --preset installed-release-user --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset installed-release-user --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
      - name: Attest installed CHttp SDK exact candidate dependency paths
        shell: bash
        run: |
          set -euo pipefail
          python3 cmake/ci/attest-cnet-once-six-rid-consumer.py \
            --rid "${{ matrix.rid }}" --family "${{ matrix.family }}"
      - name: Upload exact installed SDK and consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chttp-245-six-rid-installed-${{ matrix.rid }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/upstream-cnet-once-candidate/provenance-${{ matrix.rid }}.txt
            stage/sdk/${{ matrix.rid }}/salts-dependency-manifest.txt
            stage/sdk/${{ matrix.rid }}/saltsutils-dependency-manifest.txt
            stage/sdk/${{ matrix.rid }}/lib/cmake/Chttp/ChttpTargets.cmake
            app/tests/installed/build/release/Testing/Temporary/LastTest.log
