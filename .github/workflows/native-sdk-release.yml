name: CHttp native SDK release
# CHttp native SDK release pipeline

on:
  workflow_dispatch:
    inputs:
      salts_candidate_run_id:
        description: Successful Salts CI candidate run (requires SHA; skips publication)
        type: string
        default: ''
      salts_candidate_sha:
        description: Full source SHA of the Salts candidate
        type: string
        default: ''
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "packaging/nuget/**"
      - "vcpkg.json"
      - ".github/workflows/native-sdk-release.yml"
      - ".github/actions/setup-salts-sdk/**"
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: chttp-native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate selection
        shell: pwsh
        env:
          CANDIDATE_RUN: ${{ inputs.salts_candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.salts_candidate_sha }}
        run: |
          if ($env:CANDIDATE_RUN -or $env:CANDIDATE_SHA) {
            if ($env:CANDIDATE_RUN -notmatch '^[1-9][0-9]*$' -or $env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
              throw 'Specify both the candidate run ID and full source SHA'
            }
          }
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "${{ github.event_name }}" = "pull_request" || test "${{ github.event_name }}" = "workflow_dispatch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Select candidate Salts SDK
        if: inputs.salts_candidate_run_id != ''
        uses: qigao/salts/.github/actions/restore-candidate-sdk@e56b5778aad10b37d0a2ed86a953f366eb3a30d8
        with:
          run-id: ${{ inputs.salts_candidate_run_id }}
          commit: ${{ inputs.salts_candidate_sha }}
          rid: linux-x64
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh linux-x64
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          export QIGAO_SDK_RID=linux-x64 QIGAO_TARGET_TRIPLET=x64-linux QIGAO_HOST_TRIPLET=x64-linux
          cmake --preset ci-sdk-release-user -DBUILD_TESTING=ON -DBUILD_TESTS=ON
          cmake --build --preset ci-sdk-release-user --parallel 2
          ctest --preset ci-sdk-release-user --output-on-failure --no-tests=error
          cmake --build --preset install-ci-sdk-release-user
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=linux
          arch=x64
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64; triplet=x64-osx ;;
            ARM64) rid=macos-arm64; triplet=arm64-osx ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

      - name: Select candidate Salts SDK
        if: inputs.salts_candidate_run_id != ''
        uses: qigao/salts/.github/actions/restore-candidate-sdk@e56b5778aad10b37d0a2ed86a953f366eb3a30d8
        with:
          run-id: ${{ inputs.salts_candidate_run_id }}
          commit: ${{ inputs.salts_candidate_sha }}
          rid: ${{ steps.env.outputs.rid }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh "${{ steps.env.outputs.rid }}"
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ steps.env.outputs.rid }}"
          export QIGAO_SDK_RID="${{ steps.env.outputs.rid }}"
          export QIGAO_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" QIGAO_HOST_TRIPLET="${{ steps.env.outputs.triplet }}"
          cmake --preset ci-sdk-release-user -DBUILD_TESTING=ON -DBUILD_TESTS=ON
          cmake --build --preset ci-sdk-release-user --parallel 2
          ctest --preset ci-sdk-release-user --output-on-failure --no-tests=error
          cmake --build --preset install-ci-sdk-release-user
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=macos
          arch=$RUNNER_ARCH
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) { throw "canonical VCPKG_ROOT unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_CACHE_REPOSITORY_ROOT) -or
              -not (Test-Path -LiteralPath (Join-Path $env:VCPKG_CACHE_REPOSITORY_ROOT "cmake/QigaoVcpkgToolchain.cmake") -PathType Leaf)) {
            throw "canonical qigao vcpkg toolchain unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "shared vcpkg NuGet cache unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Select candidate Salts SDK
        if: inputs.salts_candidate_run_id != ''
        uses: qigao/salts/.github/actions/restore-candidate-sdk@e56b5778aad10b37d0a2ed86a953f366eb3a30d8
        with:
          run-id: ${{ inputs.salts_candidate_run_id }}
          commit: ${{ inputs.salts_candidate_sha }}
          rid: windows-x64
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore native SDK graph
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64
      - name: Configure, build and install
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\%QIGAO_VCPKG_WINDOWS_TRIPLET%\bin;%PATH%"
          set "QIGAO_SDK_RID=windows-x64"
          set "QIGAO_TARGET_TRIPLET=%QIGAO_VCPKG_WINDOWS_TRIPLET%"
          set "QIGAO_HOST_TRIPLET=%QIGAO_VCPKG_WINDOWS_HOST_TRIPLET%"
          cmake --preset ci-sdk-release-user -DBUILD_TESTING=ON -DBUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-sdk-release-user --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset ci-sdk-release-user --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
          cmake --build --preset install-ci-sdk-release-user
          if errorlevel 1 exit /b 1
      - name: Verify Windows SDK
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          $config = Join-Path $prefix "lib\cmake\Chttp\ChttpConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          @(
            "version=${{ needs.metadata.outputs.version }}"
            "commit=$env:GITHUB_SHA"
            "os=windows"
            "arch=x64"
            "profile=release"
          ) | Set-Content -LiteralPath (Join-Path $prefix "chttp-sdk-manifest.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    if: inputs.salts_candidate_run_id == ''
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"
          test -n "${ANDROID_NDK_HOME:-}"

      - name: Restore target SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh android-arm64-v8a
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          export QIGAO_SDK_RID=android-arm64-v8a QIGAO_TARGET_TRIPLET=arm64-android QIGAO_HOST_TRIPLET=x64-linux
          cmake --preset ci-android-sdk-release-user
          cmake --build --preset ci-android-sdk-release-user --parallel 2
          cmake --build --preset install-ci-android-sdk-release-user
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=android
          abi=arm64-v8a
          api=android-26
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  ios:
    if: inputs.salts_candidate_run_id == ''
    name: iOS SDK / ${{ matrix.name }}
    needs: metadata
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device arm64, triplet: arm64-ios, rid: ios-arm64, sysroot: iphoneos}
    env:
      X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore target SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh "${{ matrix.rid }}"

      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          build="$GITHUB_WORKSPACE/build/${{ matrix.rid }}"
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ matrix.rid }}"
          export QIGAO_SDK_RID="${{ matrix.rid }}" QIGAO_TARGET_TRIPLET="${{ matrix.triplet }}"
          export QIGAO_HOST_TRIPLET=arm64-osx QIGAO_IOS_SYSROOT="${{ matrix.sysroot }}"
          cmake --preset ci-ios-sdk-release-user
          cmake --build --preset ci-ios-sdk-release-user --parallel 2
          cmake --build --preset install-ci-ios-sdk-release-user

          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          test -f "$prefix/include/chttp_service/service.h"
          test -f "$prefix/include/chttp_rpc_service/service.h"
          grep -q 'CHttp::Service' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          grep -q 'CHttp::RpcService' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"

          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=ios
          rid=${{ matrix.rid }}
          triplet=${{ matrix.triplet }}
          profile=release
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    if: inputs.salts_candidate_run_id == ''
    name: Pack CHttp.Native
    needs: [metadata, linux, macos, windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chttp-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/ios-arm64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/linux-x64/include/chttp_service/service.h
          test -f package/sdk/windows-x64/include/chttp_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_service/service.h
          test -f package/sdk/linux-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/windows-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_rpc_service/service.h
          for rid in ios-arm64; do
            test -f "package/sdk/$rid/include/chttp_service/service.h"
            test -f "package/sdk/$rid/include/chttp_rpc_service/service.h"
            grep -q 'CHttp::Service' "package/sdk/$rid/lib/cmake/Chttp/ChttpTargets.cmake"
            grep -q 'CHttp::RpcService' "package/sdk/$rid/lib/cmake/Chttp/ChttpTargets.cmake"
          done
          grep -q 'CHttp::Service' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          grep -q 'CHttp::RpcService' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          test "$(find package/sdk -maxdepth 2 -name chttp-sdk-manifest.txt | wc -l)" -eq 5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Pack NuGet
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/CHttp.Native.csproj --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/CHttp.Native.csproj --no-restore --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"
          nupkg="dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/chttp.nuspec"
          if grep -q '<dependencies' "$RUNNER_TEMP/chttp.nuspec"; then
            echo "CHttp.Native must not publish dependency metadata" >&2
            cat "$RUNNER_TEMP/chttp.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/ios-arm64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: inputs.salts_candidate_run_id == '' && inputs.salts_candidate_sha == '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CHttp $VERSION" --generate-notes
