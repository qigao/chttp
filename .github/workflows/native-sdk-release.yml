name: CHttp native SDK release
# CHttp native SDK release pipeline

on:
  workflow_dispatch:
    inputs:
      salts_candidate_sha:
        description: Optional Salts SHA for exact candidate qualification (blank restores floating prerelease NuGet SDKs)
        type: string
        default: ''
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: chttp-native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_sha: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve candidate SDK
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.salts_candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = ''
          $sha = $env:CANDIDATE_SHA
          if ($sha) {
            if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Specify a full lowercase Salts commit SHA' }
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw 'Release tags cannot consume candidate SDKs' }
            $result = gh api --method GET repos/qigao/salts/actions/workflows/ci.yml/runs -f head_sha=$sha -f event=workflow_dispatch -f status=success -f per_page=100
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Salts CI for the requested SHA' }
            $runs = @(($result | ConvertFrom-Json).workflow_runs)
            foreach ($candidate in $runs) {
              if ($candidate.head_sha -ne $sha) { throw 'Producer SHA filter mismatch' }
              $artifactsJson = gh api "repos/qigao/salts/actions/runs/$($candidate.id)/artifacts?per_page=100"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect candidate SDK artifacts' }
              $names = @(($artifactsJson | ConvertFrom-Json).artifacts | Where-Object { -not $_.expired } | ForEach-Object name)
              if ($names -contains 'salts-sdk-linux-x64' -and
                  $names -contains 'salts-sdk-windows-x64' -and
                  $names -contains 'salts-sdk-macos') {
                $run = $candidate.id
                break
              }
            }
            if (-not $run) {
              throw "No successful SDK producer for $sha; run Salts CI with prepare_release=true"
            }
            Write-Output "Salts $sha -> successful producer run $run"
          }
          "run_id=$run" >> $env:GITHUB_OUTPUT
          "commit=$sha" >> $env:GITHUB_OUTPUT
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "${{ github.event_name }}" = "pull_request" || test "${{ github.event_name }}" = "workflow_dispatch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


  host:
    name: ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64 SDK, family: linux, runner: ubuntu-24.04, preset: ci-sdk-release-user, artifact: chttp-sdk-linux-x64}
          - {name: macOS SDK, family: macos, runner: macos-15, preset: ci-macos-sdk-release-user, artifact: chttp-sdk-macos}
          - {name: Windows x64 SDK, family: windows, runner: windows-latest, preset: ci-sdk-release-user, artifact: chttp-sdk-windows-x64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAPI conformance test requirements
        shell: bash
        run: python -m pip install -r openapi/tests/requirements-conformance.txt
      - name: Configure canonical vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Linux toolchain
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Prepare macOS GCC toolchain
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja gcc@15
      - name: Prepare Windows MSVC toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw 'missing MSVC x64 toolchain' }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Verify shared vcpkg cache contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) { throw 'missing canonical VCPKG_ROOT' }
          $root = $env:VCPKG_CACHE_REPOSITORY_ROOT
          if ([string]::IsNullOrWhiteSpace($root) -or
              -not (Test-Path -LiteralPath (Join-Path $root 'cmake/QigaoVcpkgToolchain.cmake') -PathType Leaf)) {
            throw 'missing canonical shared vcpkg toolchain'
          }
          if ($env:VCPKG_BINARY_SOURCES -notmatch 'nugetconfig' -or
              $env:VCPKG_NUGET_REPOSITORY -ne 'https://github.com/qigao/vcpkg-cache') {
            throw 'shared vcpkg NuGet binary cache is unavailable'
          }
      - name: Select native SDK platform
        id: target
        shell: pwsh
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:FAMILY) {
            'linux'   { $rid = 'linux-x64'; $triplet = 'x64-linux'; $hostTriplet = $triplet }
            'macos'   {
              switch ($env:RUNNER_ARCH) {
                'X64'   { $rid = 'macos-x64'; $triplet = 'x64-osx' }
                'ARM64' { $rid = 'macos-arm64'; $triplet = 'arm64-osx' }
                default { throw "unsupported macOS RUNNER_ARCH=$env:RUNNER_ARCH" }
              }
              $hostTriplet = $triplet
            }
            'windows' {
              $rid = 'windows-x64'
              $triplet = $env:QIGAO_VCPKG_WINDOWS_TRIPLET
              $hostTriplet = $env:QIGAO_VCPKG_WINDOWS_HOST_TRIPLET
              if ([string]::IsNullOrWhiteSpace($triplet) -or [string]::IsNullOrWhiteSpace($hostTriplet)) {
                throw 'missing Windows vcpkg toolchain triplets'
              }
            }
            default { throw "unsupported family $env:FAMILY" }
          }
          "rid=$rid" >> $env:GITHUB_OUTPUT
          "QIGAO_SDK_RID=$rid" >> $env:GITHUB_ENV
          "QIGAO_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          "QIGAO_HOST_TRIPLET=$hostTriplet" >> $env:GITHUB_ENV
      - name: Restore compiler object cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: ${{ matrix.family }}-${{ matrix.preset }}-${{ steps.target.outputs.rid }}
          sdk_identity: ${{ needs.metadata.outputs.candidate_sha || 'salts-2.3-pre-utils-4.3-pre' }}

      - name: Select exact candidate Salts SDK
        if: needs.metadata.outputs.candidate_run_id != ''
        uses: qigao/salts/.github/actions/restore-candidate-sdk@e56b5778aad10b37d0a2ed86a953f366eb3a30d8
        with:
          run-id: ${{ needs.metadata.outputs.candidate_run_id }}
          commit: ${{ needs.metadata.outputs.candidate_sha }}
          rid: ${{ steps.target.outputs.rid }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Unix native SDK graph
        if: matrix.family != 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh "${{ steps.target.outputs.rid }}"
      - name: Restore Windows native SDK graph
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64

      - name: Configure, test and install Unix SDK
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error
          cmake --build --preset "install-${{ matrix.preset }}"
      - name: Configure, test and install Windows SDK
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "QIGAO_CANONICAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_CANONICAL_VCPKG_ROOT%"
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\%QIGAO_VCPKG_WINDOWS_TRIPLET%\bin;%PATH%"
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON -DBUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
          cmake --build --preset "install-${{ matrix.preset }}"
          if errorlevel 1 exit /b 1
      - name: Verify installed SDK and write manifest
        shell: pwsh
        env:
          CHTTP_VERSION: ${{ needs.metadata.outputs.version }}
          CHTTP_SOURCE_SHA: ${{ needs.metadata.outputs.source_commit }}
          CHTTP_FAMILY: ${{ matrix.family }}
          CHTTP_RID: ${{ steps.target.outputs.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage/sdk/$env:CHTTP_RID"
          $config = Join-Path $prefix 'lib/cmake/Chttp/ChttpConfig.cmake'
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          $arch = if ($env:CHTTP_FAMILY -eq 'macos') { $env:RUNNER_ARCH } else { 'x64' }
          @(
            "version=$env:CHTTP_VERSION"
            "commit=$env:CHTTP_SOURCE_SHA"
            "os=$env:CHTTP_FAMILY"
            "arch=$arch"
            'profile=release'
          ) | Set-Content -LiteralPath (Join-Path $prefix 'chttp-sdk-manifest.txt')
      - name: Report ccache compilation statistics
        if: always()
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -ErrorAction SilentlyContinue
          if ($ccache) { & $ccache.Source --show-stats }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  cross:
    name: ${{ matrix.name }}
    if: needs.metadata.outputs.candidate_run_id == ''
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Android arm64-v8a SDK, family: android, runner: ubuntu-24.04, rid: android-arm64-v8a, triplet: arm64-android, host_triplet: x64-linux, preset: ci-android-sdk-release-user, sysroot: ''}
          - {name: iOS device arm64 SDK, family: ios, runner: macos-15, rid: ios-arm64, triplet: arm64-ios, host_triplet: arm64-osx, preset: ci-ios-sdk-release-user, sysroot: iphoneos}
    env:
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      QIGAO_IOS_SYSROOT: ${{ matrix.sysroot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select iOS binary cache namespace
        if: matrix.family == 'ios'
        shell: bash
        run: echo "X_VCPKG_NUGET_ID_PREFIX=vcpkg-cache" >> "$GITHUB_ENV"
      - name: Configure canonical vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare Android toolchain
        if: matrix.family == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${ANDROID_NDK_HOME:-}"
      - name: Prepare iOS toolchain
        if: matrix.family == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          brew install ninja nasm
      - name: Verify shared binary cache
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          test -n "${VCPKG_CACHE_REPOSITORY_ROOT:-}"
          test -f "$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo 'shared vcpkg NuGet cache unavailable' >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = 'https://github.com/qigao/vcpkg-cache'
      - name: Restore cross compiler object cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: ${{ matrix.family }}-${{ matrix.rid }}-${{ matrix.preset }}
          sdk_identity: salts-2.3-pre-utils-4.3-pre
      - name: Restore cross native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdks.sh "${{ matrix.rid }}"
      - name: Configure and install cross SDK (build-only)
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ matrix.rid }}"
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          cmake --build --preset "install-${{ matrix.preset }}"
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          if [ "${{ matrix.family }}" = ios ]; then
            test -f "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
            test -f "$prefix/include/chttp_service/service.h"
            test -f "$prefix/include/chttp_rpc_service/service.h"
            grep -q 'CHttp::Service' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
            grep -q 'CHttp::RpcService' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
            cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=${{ needs.metadata.outputs.source_commit }}
          os=ios
          rid=${{ matrix.rid }}
          triplet=${{ matrix.triplet }}
          profile=release
          EOF
          else
            cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=${{ needs.metadata.outputs.source_commit }}
          os=android
          abi=arm64-v8a
          api=android-26
          profile=release
          EOF
          fi
      - name: Report ccache compilation statistics
        if: always()
        shell: pwsh
        run: |
          $ccache = Get-Command ccache -ErrorAction SilentlyContinue
          if ($ccache) { & $ccache.Source --show-stats }
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    if: needs.metadata.outputs.candidate_run_id == ''
    name: Pack CHttp.Native
    needs: [metadata, host, cross]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: chttp-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/ios-arm64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/linux-x64/include/chttp_service/service.h
          test -f package/sdk/windows-x64/include/chttp_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_service/service.h
          test -f package/sdk/linux-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/windows-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_rpc_service/service.h
          for rid in ios-arm64; do
            test -f "package/sdk/$rid/include/chttp_service/service.h"
            test -f "package/sdk/$rid/include/chttp_rpc_service/service.h"
            grep -q 'CHttp::Service' "package/sdk/$rid/lib/cmake/Chttp/ChttpTargets.cmake"
            grep -q 'CHttp::RpcService' "package/sdk/$rid/lib/cmake/Chttp/ChttpTargets.cmake"
          done
          grep -q 'CHttp::Service' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          grep -q 'CHttp::RpcService' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          test "$(find package/sdk -maxdepth 2 -name chttp-sdk-manifest.txt | wc -l)" -eq 5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Pack NuGet
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/CHttp.Native.csproj --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/CHttp.Native.csproj --no-restore --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"
          nupkg="dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/chttp.nuspec"
          if grep -q '<dependencies' "$RUNNER_TEMP/chttp.nuspec"; then
            echo "CHttp.Native must not publish dependency metadata" >&2
            cat "$RUNNER_TEMP/chttp.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/ios-arm64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: needs.metadata.outputs.candidate_run_id == '' && needs.metadata.outputs.candidate_sha == '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CHttp $VERSION" --generate-notes
