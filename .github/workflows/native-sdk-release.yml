name: CHttp native SDK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-native-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  SALTS_SDK_VERSION: "1.8.3"
  SALTS_UTILS_SDK_VERSION: "4.1.3"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"

      - name: Restore versioned native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdks.sh linux-x64
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          salts_utils=$SALTS_UTILS_SDK_VERSION
          os=linux
          arch=x64
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        id: env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm ninja
          test -n "${VCPKG_ROOT:-}"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64; triplet=x64-osx ;;
            ARM64) rid=macos-arm64; triplet=arm64-osx ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

      - name: Restore versioned native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdks.sh "${{ steps.env.outputs.rid }}"
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ steps.env.outputs.rid }}"
          cmake -S . -B build/native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="${{ steps.env.outputs.triplet }}" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/native-sdk --parallel 2
          cmake --install build/native-sdk
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          salts_utils=$SALTS_UTILS_SDK_VERSION
          os=macos
          arch=$RUNNER_ARCH
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) { throw "canonical VCPKG_ROOT unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:QIGAO_VCPKG_TOOLCHAIN_FILE) -or
              -not (Test-Path -LiteralPath $env:QIGAO_VCPKG_TOOLCHAIN_FILE -PathType Leaf)) {
            throw "canonical qigao vcpkg toolchain unavailable"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_BINARY_SOURCES) -or $env:VCPKG_BINARY_SOURCES -notmatch "nugetconfig") {
            throw "shared vcpkg NuGet cache unavailable"
          }
          if ($env:VCPKG_NUGET_REPOSITORY -ne "https://github.com/qigao/vcpkg-cache") {
            throw "unexpected vcpkg cache repository: $env:VCPKG_NUGET_REPOSITORY"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Restore versioned native SDK graph
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdks.ps1 -Rid windows-x64
      - name: Configure, build and install
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build\native-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\sdk\windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build build\native-sdk --parallel 2
          if errorlevel 1 exit /b 1
          cmake --install build\native-sdk
          if errorlevel 1 exit /b 1
      - name: Verify Windows SDK
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          $config = Join-Path $prefix "lib\cmake\Chttp\ChttpConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          @(
            "version=${{ needs.metadata.outputs.version }}"
            "commit=$env:GITHUB_SHA"
            "salts=$env:SALTS_SDK_VERSION"
            "salts_utils=$env:SALTS_UTILS_SDK_VERSION"
            "os=windows"
            "arch=x64"
            "profile=release"
          ) | Set-Content -LiteralPath (Join-Path $prefix "chttp-sdk-manifest.txt")

      - name: Verify Windows installed-package consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          $probe = Join-Path $env:RUNNER_TEMP "chttp-installed-probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          @'
          cmake_minimum_required(VERSION 3.25)
          project(chttp_installed_probe NONE)
          find_package(Chttp 1.1.5 EXACT CONFIG REQUIRED
            PATHS "$ENV{CHTTP_ROOT}"
            NO_DEFAULT_PATH)
          if(NOT TARGET CHttp::Client OR NOT TARGET CHttp::Server)
            message(FATAL_ERROR "installed CHttp package is missing Client/Server targets")
          endif()
          add_custom_target(chttp_installed_probe ALL)
          '@ | Set-Content -LiteralPath (Join-Path $probe "CMakeLists.txt")
          $env:CHTTP_ROOT = $prefix
          cmake -S $probe -B (Join-Path $probe "build") -G Ninja
          if ($LASTEXITCODE -ne 0) { throw "installed-package configure failed" }
          cmake --build (Join-Path $probe "build")
          if ($LASTEXITCODE -ne 0) { throw "installed-package build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -n "${VCPKG_ROOT:-}"
          test -n "${QIGAO_VCPKG_TOOLCHAIN_FILE:-}"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          case "${VCPKG_BINARY_SOURCES:-}" in
            *nugetconfig*) ;;
            *) echo "shared vcpkg NuGet cache is not configured" >&2; exit 1 ;;
          esac
          test "${VCPKG_NUGET_REPOSITORY:-}" = "https://github.com/qigao/vcpkg-cache"
          test -n "${ANDROID_NDK_HOME:-}"

      - name: Restore versioned target SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-versioned-native-sdks.sh android-arm64-v8a
      - name: Configure, build and install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake -S . -B build/android-native-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/android-native-sdk --parallel 2
          cmake --install build/android-native-sdk
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          cat > "$prefix/chttp-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          salts=$SALTS_SDK_VERSION
          salts_utils=$SALTS_UTILS_SDK_VERSION
          os=android
          abi=arm64-v8a
          api=android-26
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack CHttp.Native
    needs: [metadata, linux, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chttp-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake
          test -f package/sdk/linux-x64/include/chttp_service/service.h
          test -f package/sdk/windows-x64/include/chttp_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_service/service.h
          test -f package/sdk/linux-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/windows-x64/include/chttp_rpc_service/service.h
          test -f package/sdk/android-arm64-v8a/include/chttp_rpc_service/service.h
          grep -q 'CHttp::Service' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          grep -q 'CHttp::RpcService' package/sdk/linux-x64/lib/cmake/Chttp/ChttpTargets.cmake
          test "$(find package/sdk -maxdepth 2 -name chttp-sdk-manifest.txt | wc -l)" -eq 4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Pack NuGet
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/CHttp.Native.csproj --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/CHttp.Native.csproj --no-restore --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"
          nupkg="dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/windows-x64/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/lib/cmake/Chttp/ChttpConfig.cmake" "$RUNNER_TEMP/chttp-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chttp-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/CHttp.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CHttp $VERSION" --generate-notes
