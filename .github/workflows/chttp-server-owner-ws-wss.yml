name: CHttp server post-fix WSS attribution

on:
  pull_request:
    branches: [master]
    paths:
      - "http_server/benchmarks/**"
      - ".github/workflows/chttp-server-owner-ws-wss.yml"
  workflow_dispatch:

env:
  CHTTP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-server-wss-postfix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ws-wss:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact CHttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Salts SDKs
        uses: ./.github/actions/setup-salts-sdk

      - name: Verify fixed Salts TLS baseline
        shell: bash
        run: |
          set -euo pipefail
          version_file="$SALTS_ROOT/lib/cmake/Salts/SaltsConfigVersion.cmake"
          test -f "$version_file"
          version="$(sed -n 's/^[[:space:]]*set(PACKAGE_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' "$version_file" | head -n 1)"
          test -n "$version"
          python3 - "$version" <<'PY'
          import sys
          got = tuple(int(x) for x in sys.argv[1].split(".")[:3])
          minimum = (1, 8, 18)
          if got < minimum:
              raise SystemExit(f"Salts.Native {sys.argv[1]} is too old; need >= 1.8.18 for GmSSL full-duplex TLS fix")
          print(f"Salts.Native baseline: {sys.argv[1]} (>= 1.8.18)")
          PY

      - name: Configure release benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset release-linux-ninja \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=ON

      - name: Build WS WSS owner benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-release \
            --target chttp_server_ws_owner_benchmark -j2

      - name: Verify admission-only owner handoff boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 http_server/benchmarks/verify_owner_handoff_boundary.py

      - name: Run repeated post-fix WS WSS matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          jsonl=benchmark-results/owner-ws-wss.jsonl
          : > "$jsonl"
          cores="$(nproc)"
          {
            echo "exact_head=$CHTTP_HEAD_SHA"
            echo "logical_cores=$cores"
            echo "build_type=Release"
            uname -a
            cc --version | head -n 1
            lscpu | grep -E '^(Model name|CPU\(s\)|Core\(s\) per socket|Socket\(s\)):' || true
          } > benchmark-results/environment-ws-wss.txt

          for repeat in 1 2 3; do
            echo "benchmark repeat=$repeat"
            GITHUB_SHA="$CHTTP_HEAD_SHA" \
            CHTTP_OWNER_WS_SMALL_MESSAGES=240 \
            CHTTP_OWNER_WS_LARGE_MESSAGES=24 \
            CHTTP_OWNER_WS_WARMUP=8 \
              build/linux-gcc-release/bin/chttp_server_ws_owner_benchmark \
              | tee -a "$jsonl"
          done

      - name: Run isolated 64 KiB WSS controls
        shell: bash
        run: |
          set -euo pipefail
          for workload in wss-echo-64k wss-push-64k; do
            jsonl="benchmark-results/isolated-${workload}.jsonl"
            : > "$jsonl"
            for repeat in 1 2 3; do
              echo "isolated workload=$workload repeat=$repeat"
              GITHUB_SHA="$CHTTP_HEAD_SHA" \
              CHTTP_OWNER_WS_WORKLOAD="$workload" \
              CHTTP_OWNER_WS_SMALL_MESSAGES=240 \
              CHTTP_OWNER_WS_LARGE_MESSAGES=24 \
              CHTTP_OWNER_WS_WARMUP=8 \
                build/linux-gcc-release/bin/chttp_server_ws_owner_benchmark \
                | tee -a "$jsonl"
            done
            python3 http_server/benchmarks/verify_owner_ws_benchmark.py \
              "$jsonl" "$workload" \
              | tee "benchmark-results/isolated-${workload}-summary.md"
          done

      - name: Run focused WSS client concurrency A/B
        shell: bash
        run: |
          set -euo pipefail
          jsonl=benchmark-results/wss-client-concurrency-ab.jsonl
          : > "$jsonl"
          for repeat in 1 2 3; do
            for connections in 4 8; do
              for workload in wss-echo-32k wss-echo-64k; do
                echo "client-concurrency repeat=$repeat connections=$connections workload=$workload"
                GITHUB_SHA="$CHTTP_HEAD_SHA" \
                CHTTP_OWNER_WS_CONNECTIONS="$connections" \
                CHTTP_OWNER_WS_WORKLOAD="$workload" \
                CHTTP_OWNER_WS_SMALL_MESSAGES=240 \
                CHTTP_OWNER_WS_LARGE_MESSAGES=24 \
                CHTTP_OWNER_WS_WARMUP=8 \
                  build/linux-gcc-release/bin/chttp_server_ws_owner_benchmark \
                  | tee -a "$jsonl"
              done
            done
          done

      - name: Verify and summarize WS WSS evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 http_server/benchmarks/verify_owner_ws_benchmark.py \
            benchmark-results/owner-ws-wss.jsonl \
            | tee benchmark-results/owner-ws-wss-summary.md
          {
            echo "## CHttp post-fix WS/WSS 16/32/64-KiB attribution"
            echo
            cat benchmark-results/environment-ws-wss.txt
            echo
            cat benchmark-results/owner-ws-wss-summary.md
            echo
            echo "## Isolated 64 KiB WSS controls"
            echo
            cat benchmark-results/isolated-wss-echo-64k-summary.md
            echo
            cat benchmark-results/isolated-wss-push-64k-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw WS WSS benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: chttp-server-wss-postfix-linux-x64
          path: benchmark-results/
          if-no-files-found: error

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
