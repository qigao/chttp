name: CHttp Web lifecycle qualification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# PR qualification checks the proposed head, not GitHub's synthetic merge.
env:
  CHTTP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: chttp-web-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up current master SDKs
        uses: ./.github/actions/setup-salts-sdk
      - name: Configure exact Chttp head
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF
      - name: Install OpenAPI conformance test requirements
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -r openapi/tests/requirements-conformance.txt
      - name: Build focused lifecycle targets
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test \
            chttp_web_validation_test chttp_web_multipart_test chttp_web_upload_test chttp_web_upload_http_test chttp_web_auth_http_test chttp_web_assets_http_test \
            chttp_web_deferred_test chttp_web_sse_test \
            chttp_web_lifecycle_test chttp_web_authenticated_app_example test_ui_renderer test_ui_fragments -j2
      - name: Run focused lifecycle tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug \
            -R '^(chttp_web_(renderer_test|context_test|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
      - name: Build full Chttp graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset linux-dev-user -j2
      - name: Run Web reference example smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          printf '\n' | build/linux-gcc-debug/bin/chttp_web_crud_example
          printf '\n' | build/linux-gcc-debug/bin/chttp_web_deferred_example
          printf '\n' | build/linux-gcc-debug/bin/chttp_web_form_upload_example
          build/linux-gcc-debug/bin/chttp_web_authenticated_app_example --self-test
      - name: Run full Chttp CTest graph
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure
      - name: Verify Web lifecycle with AddressSanitizer
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test \
            chttp_web_validation_test chttp_web_multipart_test chttp_web_upload_test chttp_web_upload_http_test chttp_web_auth_http_test chttp_web_assets_http_test \
            chttp_web_deferred_test chttp_web_sse_test \
            chttp_web_lifecycle_test chttp_web_authenticated_app_example test_ui_renderer test_ui_fragments -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^(chttp_web_(renderer_test|context_test|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
      - name: Verify Web lifecycle with UndefinedBehaviorSanitizer
        shell: bash
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=ON
          cmake --build build/linux-gcc-debug --target \
            chttp_web_renderer_test chttp_web_context_test \
            chttp_web_validation_test chttp_web_multipart_test chttp_web_upload_test chttp_web_upload_http_test chttp_web_auth_http_test chttp_web_assets_http_test \
            chttp_web_deferred_test chttp_web_sse_test \
            chttp_web_lifecycle_test chttp_web_authenticated_app_example test_ui_renderer test_ui_fragments -j2
          ctest --test-dir build/linux-gcc-debug \
            -R '^(chttp_web_(renderer_test|context_test|validation_test|multipart_test|upload_test|upload_http_test|auth_http_test|assets_http_test|authenticated_app_test|deferred_test|sse_test|lifecycle_test)|openapi_ui_(renderer|fragments))$' \
            --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
