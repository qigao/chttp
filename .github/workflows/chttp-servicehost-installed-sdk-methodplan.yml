name: CHttp strict installed ServiceHost HTTP MethodPlan proof

'on':
  pull_request:
    paths:
      - ".github/workflows/chttp-servicehost-installed-sdk-methodplan.yml"
      - "app/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-installed-servicehost-methodplan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native_http:
    name: True installed Salts::ServiceHost / generated HTTP MethodPlan (Linux)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'review/chttp-installed-servicehost-methodplan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_CHTTP: ${{ github.event.pull_request.head.sha }}
      EXPECTED_SALTS: a6d1f7c6b81c72dfcdcab9a5ea8f72244ab3079a
      EXPECTED_SU: fbb5f3ee19589836ced0f3b98414e71e6dcc1388
      EXPECTED_SU_TAG: v4.3.0-rc.11
      QIGAO_SDK_RID: linux-x64
      QIGAO_TARGET_TRIPLET: x64-linux
      QIGAO_HOST_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/build/servicehost-installed/ccache
      CCACHE_COMPILERCHECK: content
      CHTTP_COMPILER_CACHE_NAMESPACE: chttp-installed-servicehost-fr1-v1
    steps:
      - name: Checkout exact CHttp candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CHTTP }}
          persist-credentials: false
      - name: Checkout upstream strict Salts owner source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: a6d1f7c6b81c72dfcdcab9a5ea8f72244ab3079a
          path: build/servicehost-installed/sources/salts
          persist-credentials: false
      - name: Checkout exact downstream SaltsUtils source
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          # The released Crypto/Unicode/IDL ABI is selected by immutable tag.
          ref: v4.3.0-rc.11
          path: build/servicehost-installed/sources/salts-utils
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@fafb1efe5ac2440bfd7a08e493988d0459d89e51
      - uses: ./build/servicehost-installed/sources/salts/.github/actions/setup-build-host
      - name: Require source-build compiler cache on Linux
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          command -v ccache
          ccache --version
          # Existing native presets mandate ccache; never silently fall back
          # to uninstrumented, unversioned or unrelated prebuilt archives.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Assert immutable strict runtime and exact FR1 MethodPlan contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          test "$(git -C build/servicehost-installed/sources/salts rev-parse HEAD)" = "$EXPECTED_SALTS"
          test "$(git -C build/servicehost-installed/sources/salts-utils rev-parse HEAD)" = "$EXPECTED_SU"
          test "$(git -C build/servicehost-installed/sources/salts-utils rev-parse "refs/tags/$EXPECTED_SU_TAG^{commit}")" = "$EXPECTED_SU"
          grep -Fq 'typedef enum salts_crypto_hash' build/servicehost-installed/sources/salts-utils/crypto/include/salts/crypto.h
          grep -Fq 'typedef struct salts_crypto_key' build/servicehost-installed/sources/salts-utils/crypto/include/salts/crypto.h
          test -f build/servicehost-installed/sources/salts/component-runtime/src/service_host.c
          grep -Fq 'X(I, FR1, bool, get_operation' app/src/chttp_service_host_component.h
          test ! -e app/include/chttp_app/service_host_candidate.h
          mkdir -p build/servicehost-installed
          printf 'salts=%s\nsaltsutils=%s\nsaltsutils_tag=%s\nchttp=%s\npublic_sdk=false\ninstalled_probe_only=true\n' \
            "$EXPECTED_SALTS" "$EXPECTED_SU" "$EXPECTED_SU_TAG" "$EXPECTED_CHTTP" \
            | tee build/servicehost-installed/provenance.txt
      - name: Install immutable Salts with strict Configurator/ServiceHost
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/chttp-installed-servicehost/salts"
          mkdir -p "$prefix"
          echo "SALTS_ROOT=$prefix" >> "$GITHUB_ENV"
          cmake --preset linux-release-ci \
            -S "$GITHUB_WORKSPACE/build/servicehost-installed/sources/salts" \
            -B build/servicehost-installed/build-salts \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DSALTS_ENABLE_COMPONENT_RUNTIME_CANDIDATE=ON \
            -DSALTS_ENABLE_COMPONENT_RUNTIME_INSTALLED_ABI_PROBE=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build/servicehost-installed/build-salts --parallel 2
          cmake --install build/servicehost-installed/build-salts
          test -f "$prefix/include/salts/component_runtime_abi.h"
          test -f "$prefix/include/salts/service_host.h"
          grep -Fq 'Salts::ServiceHost' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::Configurator' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          ! grep -Eq 'Salts::(ServiceHostCandidate|ConfiguratorCandidate)' \
            "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
      - name: Install exact SaltsUtils IDL/MethodPlan source
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-installed-servicehost/salts"
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          root="$RUNNER_TEMP/chttp-installed-servicehost/salts-utils"
          echo "SALTS_UTILS_ROOT=$root" >> "$GITHUB_ENV"
          cmake --preset ci-linux-release-user \
            -S "$GITHUB_WORKSPACE/build/servicehost-installed/sources/salts-utils" \
            -B build/servicehost-installed/build-utils \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$root" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT" \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build/servicehost-installed/build-utils --parallel 2
          cmake --install build/servicehost-installed/build-utils
          test -f "$root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" \
            build/servicehost-installed/build-utils/CMakeCache.txt
          if grep -E 'add_library\(Salts::Unicode|add_executable\(Salts::Unicode' \
               "$root/lib/cmake/SaltsUtils/SaltsUtilsTargets.cmake"; then
            echo "A second SaltsUtils-owned Unicode target was unexpectedly exported" >&2
            exit 1
          fi
          # The one canonical owner is supplied by the exact installed Salts.
          grep -Fq 'Salts::Unicode' "$SALTS_ROOT/lib/cmake/Salts/SaltsTargets.cmake"
      - name: Configure CHttp against genuine imported ServiceHost ABI
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-installed-servicehost/salts"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/chttp-installed-servicehost/salts-utils"
          export DATABIND_ROOT="$SALTS_UTILS_ROOT"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          cmake --preset ci-linux-release-user \
            -S "$GITHUB_WORKSPACE" \
            -B build/servicehost-installed/build-chttp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT" \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCHTTP_ENABLE_SERVICE_HOST_CANDIDATE=ON \
            -DCHTTP_USE_INSTALLED_SERVICE_HOST_ABI_PROBE=ON
          grep -F "Salts_DIR:PATH=$SALTS_ROOT" \
            build/servicehost-installed/build-chttp/CMakeCache.txt
          grep -F "SaltsUtils_DIR:PATH=$SALTS_UTILS_ROOT" \
            build/servicehost-installed/build-chttp/CMakeCache.txt
      - name: Build real HTTP Provider DSOs, MethodPlan and strict ABI tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/servicehost-installed/build-chttp --parallel 2 \
            --target chttp_service_host_single_listener_test \
                     chttp_service_http_test \
                     chttp_service_host_methodplan_switch_test \
                     chttp_service_host_methodplan_h2c_test \
                     chttp_service_host_h2_multiplex_test \
                     chttp_service_host_h2_stream_window_test \
                     chttp_service_host_h2_connection_window_test \
                     chttp_service_host_h2_connection_cancel_test \
                     chttp_service_host_strict_fr_abi_c \
                     chttp_service_host_strict_fr_abi_cpp
      - name: Run true imported ServiceHost HTTP H1/H2 and Provider conformance
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$RUNNER_TEMP/chttp-installed-servicehost/salts"
          export SALTS_UTILS_ROOT="$RUNNER_TEMP/chttp-installed-servicehost/salts-utils"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/servicehost-installed/build-chttp \
            -R '^(chttp_service_http_test|chttp_service_host_single_listener_test|chttp_service_host_methodplan_switch_test|chttp_service_host_methodplan_h2c_test|chttp_service_host_h2_multiplex_test|chttp_service_host_h2_stream_window_test|chttp_service_host_h2_connection_window_test|chttp_service_host_h2_connection_cancel_test|chttp_service_host_strict_fr_abi_(c|cpp))$' \
            --repeat until-fail:2 --output-on-failure --no-tests=error --timeout 180
      - name: Require no private Candidate object or CHttp published package
        shell: bash
        run: |
          set -euo pipefail
          test ! -d build/servicehost-installed/build-chttp/salts-service-host-candidate
          if cmake --build build/servicehost-installed/build-chttp --target install >/dev/null 2>&1; then
            echo "The opt-in installed ABI probe must never install/publish CHttp" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHTTP"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chttp-strict-installed-methodplan-${{ github.run_id }}
          path: |
            build/servicehost-installed/provenance.txt
            build/servicehost-installed/build-chttp/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
