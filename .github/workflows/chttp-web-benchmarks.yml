name: CHttp Web benchmark evidence

on:
  push:
    branches:
      - qualify/chttp-web-benchmarks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chttp-web-benchmarks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ROOT: ${{ runner.temp }}/salts-project
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin:${{ runner.temp }}/salts-project/external/pkgs/salts/debug/lib
    steps:
      - name: Checkout exact Chttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up current master SDKs
        uses: ./.github/actions/setup-salts-sdk
      - name: Configure benchmark build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_BENCHMARKS=ON
      - name: Build benchmark workloads
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target \
            chttp_web_benchmark openapi_ui_server -j2
      - name: Record renderer and OpenAPI benchmark evidence
        shell: bash
        run: |
          set -euxo pipefail
          result="$RUNNER_TEMP/chttp-web-benchmarks.jsonl"
          build/linux-gcc-debug/bin/chttp_web_benchmark | tee "$result"
          python3 openapi/tests/ui_benchmark.py \
            build/linux-gcc-debug/bin/openapi_ui_server \
            openapi/ui \
            --counts 44,4096 \
            --startup-samples 3 \
            --warmup 3 \
            --samples 10 | tee -a "$result"
      - name: Validate benchmark JSONL schema
        shell: bash
        run: |
          set -euxo pipefail
          python3 - "$RUNNER_TEMP/chttp-web-benchmarks.jsonl" <<'PYTHON'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          environments = [row for row in rows if row.get("kind") == "environment"]
          measurements = [row for row in rows if row.get("kind") == "measurement"]
          if len(environments) != 2:
              raise SystemExit(f"expected 2 environment rows, got {len(environments)}")
          renderer = [row for row in measurements if row.get("benchmark") == "chttp_web_renderer"]
          expected_renderer = {
              ("renderer_startup", 1),
              ("full_page_render", 1), ("fragment_render", 1),
              ("full_page_render", 8), ("fragment_render", 8),
              ("full_page_render", 32), ("fragment_render", 32),
          }
          observed_renderer = {(row.get("name"), row.get("contexts")) for row in renderer}
          if observed_renderer != expected_renderer:
              raise SystemExit(f"renderer measurements mismatch: {observed_renderer!r}")
          openapi = [row for row in measurements if "operations" in row]
          if {row.get("operations") for row in openapi} != {44, 4096}:
              raise SystemExit(f"OpenAPI workload sizes mismatch: {[row.get('operations') for row in openapi]!r}")
          for row in measurements:
              if row.get("benchmark") == "chttp_web_renderer":
                  if row["samples"] <= 0 or row["total_ns"] <= 0:
                      raise SystemExit(f"invalid renderer measurement: {row!r}")
              elif "operations" in row:
                  for key in ("startup_ms", "docs_render_http_ms", "detail_render_http_ms"):
                      if row[key]["samples"] <= 0 or row[key]["total"] <= 0:
                          raise SystemExit(f"invalid OpenAPI measurement {key}: {row!r}")
          print(f"validated {len(rows)} benchmark JSONL rows ({len(measurements)} measurements)")
          PYTHON
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: chttp-web-benchmarks-${{ github.sha }}
          path: ${{ runner.temp }}/chttp-web-benchmarks.jsonl
          if-no-files-found: error
      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
