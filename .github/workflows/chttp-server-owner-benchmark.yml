name: CHttp server owner benchmark

on:
  pull_request:
    branches: [master]
    paths:
      - "http_server/**"
      - "http_common/tests/chttp_header_cpp_test.cpp"
      - ".github/workflows/chttp-server-owner-benchmark.yml"
  workflow_dispatch:

env:
  CHTTP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  packages: read

concurrency:
  group: chttp-server-owner-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact CHttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Salts SDKs
        uses: ./.github/actions/setup-salts-sdk

      - name: Configure Release benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset release-linux-ninja \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=ON

      - name: Build owner benchmark
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build --preset build-default-linux \
            --target chttp_server_owner_benchmark -j2

      - name: Run owner benchmark
        shell: bash
        env:
          CHTTP_OWNER_BENCH_REQUESTS: "200"
          CHTTP_OWNER_BENCH_WARMUP: "20"
        run: |
          set -euo pipefail
          mkdir -p build/benchmark-evidence
          build/linux-gcc-release/bin/chttp_server_owner_benchmark \
            | tee build/benchmark-evidence/chttp-server-owner.jsonl
          python3 http_server/benchmarks/verify_owner_benchmark.py \
            build/benchmark-evidence/chttp-server-owner.jsonl \
            | tee build/benchmark-evidence/chttp-server-owner-summary.md
          {
            echo "## CHttp owner-affine H1 scaling"
            echo
            cat build/benchmark-evidence/chttp-server-owner-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload owner benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: chttp-server-owner-benchmark-linux-x64
          path: build/benchmark-evidence/
          if-no-files-found: error

      - name: Verify exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_HEAD_SHA"
