name: CHttp Web package qualification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# PR qualification checks the proposed head, not GitHub's synthetic merge.
env:
  CHTTP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: chttp-web-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHTTP_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up current master SDKs
        uses: ./.github/actions/setup-salts-sdk
      - name: Verify SaltsUtils component export
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/salts-utils-component-probe"
          build="$RUNNER_TEMP/salts-utils-component-probe-build"
          mkdir -p "$src"
          cat > "$src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(salts_utils_component_probe LANGUAGES C)
          find_package(SaltsUtils CONFIG REQUIRED
            PATHS "$ENV{SALTS_UTILS_ROOT}" NO_DEFAULT_PATH)
          if(NOT TARGET Salts::Databind)
            message(FATAL_ERROR "SaltsUtils did not export Salts::Databind")
          endif()
          get_target_property(component_type Salts::Databind TYPE)
          if(NOT component_type STREQUAL "SHARED_LIBRARY")
            message(FATAL_ERROR "Salts::Databind must be the concrete runtime")
          endif()
          CMAKE
          cmake -S "$src" -B "$build" -G Ninja
      - name: Build and install exact Chttp package
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$RUNNER_TEMP/chttp-install"
          cmake --preset linux-dev-user \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/linux-gcc-debug --target install -j2
          test -f "$prefix/include/chttp_web/web.h"
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          grep -q 'CHttp::Web' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          if grep -R -n "$GITHUB_WORKSPACE" "$prefix/lib/cmake/Chttp"; then
            echo "installed Chttp package contains source-tree paths" >&2
            exit 1
          fi
      - name: Configure standalone installed consumer
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/chttp-web-consumer"
          build="$RUNNER_TEMP/chttp-web-consumer-build"
          prefix="$RUNNER_TEMP/chttp-install"
          mkdir -p "$src"
          cp web/tests/installed/CMakeLists.txt web/tests/installed/main.c "$src/"
          cmake -S "$src" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$build" -j2
      - name: Run standalone installed consumer
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/chttp-install/lib:/opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin:${{ runner.temp }}/salts-project/external/pkgs/salts/debug/lib
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/chttp-web-consumer-build/chttp_web_consumer"
      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHTTP_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
