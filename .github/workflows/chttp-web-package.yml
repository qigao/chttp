name: CHttp Web package qualification

on:
  push:
    branches:
      - qualify/chttp-web-package
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chttp-web-package-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SALTS_SHA: 801202e58c2d86b35202414d4812e79a2fd25bae
  SALTS_UTILS_SHA: 8016a93f9b0f14c053ba87ce5a18d40f77fa8770
  VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Chttp head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Checkout exact public dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git init salts
          git -C salts remote add origin https://github.com/qigao/salts.git
          git -C salts fetch --depth=1 origin "$SALTS_SHA"
          git -C salts checkout --detach FETCH_HEAD
          test "$(git -C salts rev-parse HEAD)" = "$SALTS_SHA"

          git init salts-utils
          git -C salts-utils remote add origin https://github.com/qigao/salts-utils.git
          git -C salts-utils fetch --depth=1 origin "$SALTS_UTILS_SHA"
          git -C salts-utils checkout --detach FETCH_HEAD
          test "$(git -C salts-utils rev-parse HEAD)" = "$SALTS_UTILS_SHA"

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout --detach "$VCPKG_SHA"
          test "$(git -C vcpkg rev-parse HEAD)" = "$VCPKG_SHA"

      - name: Restore vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tbe-30-vcpkg-x64-linux-b1b19307-v1

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg
          bash salts-utils/cmake/ci/install-re2c.sh

      - name: Restore pinned Salts debug package
        id: salts-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
          key: salts-pkg-v1-${{ runner.os }}-${{ runner.arch }}-gcc-debug-801202e58c2d86b35202414d4812e79a2fd25bae-vcpkg-b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

      - name: Build and install exact Salts
        if: steps.salts-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2

      - name: Expose exact Salts profile
        shell: bash
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          test -f "$package/lib/cmake/Salts/SaltsConfig.cmake"
          sudo ln -sfn "$package" /opt/salts/debug

      - name: Build standalone host Lemon
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S salts-utils/tools/lemon -B salts-utils/build/host-lemon             -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build salts-utils/build/host-lemon --target lemon -j2

      - name: Build and install exact SaltsUtils
        shell: bash
        working-directory: salts-utils
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF             -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/salts-utils/build/host-lemon/lemon"
          cmake --build build/linux-gcc-debug --target install -j2
          test -f /opt/salts-utils/debug/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake

      - name: Expose exact SaltsUtils profile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/salts-project/external/pkgs/salts-utils"
          ln -sfn /opt/salts-utils/debug "$RUNNER_TEMP/salts-project/external/pkgs/salts-utils/debug"

      - name: Build and install exact Chttp package
        shell: bash
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          LD_LIBRARY_PATH: /opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin
        run: |
          set -euxo pipefail
          prefix="$RUNNER_TEMP/chttp-install"
          cmake --preset linux-dev-user             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF             -DBUILD_TESTS=OFF             -DBUILD_EXAMPLES=OFF             -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/linux-gcc-debug --target install -j2
          test -f "$prefix/include/chttp_web/web.h"
          test -f "$prefix/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          grep -q 'CHttp::Web' "$prefix/lib/cmake/Chttp/ChttpTargets.cmake"
          if grep -R -n "$GITHUB_WORKSPACE" "$prefix/lib/cmake/Chttp"; then
            echo "installed Chttp package contains source-tree paths" >&2
            exit 1
          fi

      - name: Configure standalone installed consumer
        shell: bash
        env:
          SALTS_ROOT: ${{ runner.temp }}/salts-project/external/pkgs/salts/debug
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/chttp-web-consumer"
          build="$RUNNER_TEMP/chttp-web-consumer-build"
          prefix="$RUNNER_TEMP/chttp-install"
          mkdir -p "$src"
          cat > "$src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(chttp_web_consumer LANGUAGES C)
          find_package(Chttp CONFIG REQUIRED)
          add_executable(chttp_web_consumer main.c)
          target_link_libraries(chttp_web_consumer PRIVATE CHttp::Web)
          CMAKE
          cat > "$src/main.c" <<'C'
          #include <chttp_web/web.h>

          int main(void) {
            chttp_web_security_policy policy =
                chttp_web_security_reference_policy();
            return policy.nosniff ? 0 : 1;
          }
          C
          cmake -S "$src" -B "$build" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$build" -j2

      - name: Run standalone installed consumer
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/chttp-install/lib:/opt/salts-utils/debug/lib:/opt/salts-utils/debug/bin:${{ runner.temp }}/salts-project/external/pkgs/salts/debug/lib
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/chttp-web-consumer-build/chttp_web_consumer"

      - name: Verify exact head and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
